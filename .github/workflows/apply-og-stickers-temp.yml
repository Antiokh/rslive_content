name: Temporary apply approved OG stickers

on:
  push:
    branches:
      - agent/apply-og-stickers

permissions:
  contents: write

jobs:
  apply-og-stickers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-og-stickers
          fetch-depth: 1

      - name: Load approved review decisions
        run: |
          git fetch origin agent/og-sticker-review:refs/remotes/origin/agent/og-sticker-review
          git show origin/agent/og-sticker-review:docs/OG_STICKER_REVIEW.md > /tmp/OG_STICKER_REVIEW.md

      - name: Apply approved ogSticker values
        shell: python
        run: |
          from pathlib import Path
          import re

          report = Path('/tmp/OG_STICKER_REVIEW.md').read_text(encoding='utf-8')
          start = '## Предложения, отличающиеся от текущего OG'
          end = '## Полный инвентарь'
          if start not in report or end not in report:
              raise SystemExit('review sections not found')
          section = report.split(start, 1)[1].split(end, 1)[0]

          decisions = {}
          for line in section.splitlines():
              if not line.startswith('| ') or line.startswith('| Текущий стикер') or line.startswith('|---'):
                  continue
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3:
                  raise SystemExit(f'cannot parse review row: {line[:180]}')
              _current, middle, target = parts
              route_match = re.match(r'`([^`]+)`<br><br>', middle)
              slug_matches = re.findall(r'<code>([^<]+)</code>', target)
              if not route_match or not slug_matches:
                  raise SystemExit(f'cannot parse route/target: {line[:180]}')
              route = route_match.group(1)
              slug = slug_matches[-1].strip()
              if '→' in slug or ' ' in slug:
                  raise SystemExit(f'invalid proposed slug for {route}: {slug}')
              decisions[route] = slug

          # Explicit latest user decision; keep this even if the review document changes later.
          decisions['/integration/social/'] = 'heisenberg'

          root = Path('src/content/docs')
          route_to_file = {}
          for path in list(root.rglob('*.mdx')) + list(root.rglob('*.md')):
              rel = path.relative_to(root)
              if rel.name in ('index.mdx', 'index.md'):
                  parts = rel.parent.parts
              else:
                  parts = rel.with_suffix('').parts
              route = '/' if not parts else '/' + '/'.join(parts) + '/'
              if route in route_to_file:
                  raise SystemExit(f'duplicate route {route}: {route_to_file[route]} and {path}')
              route_to_file[route] = path

          missing = sorted(route for route in decisions if route not in route_to_file)
          if missing:
              raise SystemExit('approved routes without MD/MDX file: ' + ', '.join(missing))

          changed = []
          already = []
          for route, slug in sorted(decisions.items()):
              path = route_to_file[route]

              # Re-read the exact current working-tree version immediately before writing it.
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'frontmatter missing: {path}')
              end_idx = text.find('\n---\n', 4)
              if end_idx < 0:
                  raise SystemExit(f'frontmatter end missing: {path}')

              front = text[4:end_idx]
              match = re.search(r'(?m)^ogSticker:\s*([^\n]+)\s*$', front)
              current = match.group(1).strip().strip('"\'') if match else None
              if current == slug:
                  already.append((route, slug))
                  continue

              if match:
                  front = front[:match.start()] + f'ogSticker: {slug}' + front[match.end():]
              else:
                  if front and not front.endswith('\n'):
                      front += '\n'
                  front += f'ogSticker: {slug}\n'

              new_text = '---\n' + front + text[end_idx + 1:]
              path.write_text(new_text, encoding='utf-8')
              changed.append((route, current, slug, str(path)))

          if not changed:
              raise SystemExit('no ogSticker changes produced')

          social = route_to_file['/integration/social/'].read_text(encoding='utf-8')
          social_front = social.split('\n---\n', 1)[0]
          if not re.search(r'(?m)^ogSticker:\s*heisenberg\s*$', social_front):
              raise SystemExit('/integration/social/ was not set to heisenberg')
          if re.search(r'(?m)^ogSticker:\s*breaking-bad-crystals\s*$', social_front):
              raise SystemExit('/integration/social/ incorrectly uses breaking-bad-crystals')

          print(f'approved decisions: {len(decisions)}')
          print(f'changed files: {len(changed)}')
          print(f'already matching: {len(already)}')
          for route, old, new, path in changed:
              print(f'{route}: {old or "<missing>"} -> {new} [{path}]')

      - name: Sanity-check diff
        run: |
          if git diff --name-only | grep -vE '^src/content/docs/.*\.(md|mdx)$' | grep -q .; then
            echo 'Unexpected changed paths:'
            git diff --name-only
            exit 1
          fi
          git diff --check
          echo "Changed MD/MDX files: $(git diff --name-only | wc -l)"

      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git rm .github/workflows/apply-og-stickers-temp.yml
          git add src/content/docs
          git diff --cached --check
          git commit -m "content: apply approved OG sticker audit"
          git push origin HEAD:agent/apply-og-stickers
