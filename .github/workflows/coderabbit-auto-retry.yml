name: CodeRabbit Auto Retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      CODERABBIT_CONTROL_REPO: ${{ vars.CODERABBIT_CONTROL_REPO }}
      CODERABBIT_CONTROL_ISSUE_NUMBER: ${{ vars.CODERABBIT_CONTROL_ISSUE_NUMBER }}
      CODERABBIT_COORDINATION_TOKEN: ${{ secrets.CODERABBIT_COORDINATION_TOKEN }}

    steps:
      - name: Retry rate-limited CodeRabbit reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODERABBIT_COORDINATION_TOKEN != '' && secrets.CODERABBIT_COORDINATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const coderabbitLogin = 'coderabbitai[bot]';
            const autoRetryMarker = '<!-- coderabbit-auto-retry -->';
            const controlMarker = '<!-- coderabbit-control -->';
            const retryCooldownMs = 30 * 60 * 1000;
            const controlRepoFullName = process.env.CODERABBIT_CONTROL_REPO?.trim() || '';
            const controlIssueNumber = Number(process.env.CODERABBIT_CONTROL_ISSUE_NUMBER || '0');
            const coordinationTokenConfigured = Boolean(
              process.env.CODERABBIT_COORDINATION_TOKEN && process.env.CODERABBIT_COORDINATION_TOKEN.trim(),
            );
            const controlRepoConfigured =
              controlRepoFullName.length > 0 && Number.isInteger(controlIssueNumber) && controlIssueNumber > 0;
            const currentRepoFullName = `${owner}/${repo}`;

            const controlTarget = (() => {
              if (!controlRepoConfigured) return null;
              const [controlOwner, controlRepo] = controlRepoFullName.split('/');
              if (!controlOwner || !controlRepo) {
                core.warning(`Invalid CODERABBIT_CONTROL_REPO value: ${controlRepoFullName}`);
                return null;
              }
              if (controlRepoFullName !== currentRepoFullName && !coordinationTokenConfigured) {
                core.warning(
                  'Central CodeRabbit coordination is configured for another repository, but CODERABBIT_COORDINATION_TOKEN is missing.',
                );
                return null;
              }
              return { owner: controlOwner, repo: controlRepo, issue_number: controlIssueNumber };
            })();

            function getEffectiveTimestamp(comment) {
              return new Date(comment.updated_at || comment.created_at).getTime();
            }

            function parseDurationToMs(text) {
              if (!text) return null;

              let totalMs = 0;
              const normalized = text
                .toLowerCase()
                .replace(/,/g, ' ')
                .replace(/\band\b/g, ' ');
              const regex =
                /(\d+)\s*(day|days|hour|hours|hr|hrs|minute|minutes|min|mins|second|seconds|sec|secs)/g;

              for (const match of normalized.matchAll(regex)) {
                const value = Number(match[1]);
                const unit = match[2];
                if (!Number.isFinite(value)) continue;

                if (unit.startsWith('day')) totalMs += value * 24 * 60 * 60 * 1000;
                else if (unit.startsWith('hour') || unit === 'hr' || unit === 'hrs') {
                  totalMs += value * 60 * 60 * 1000;
                } else if (unit.startsWith('min')) {
                  totalMs += value * 60 * 1000;
                } else if (unit.startsWith('sec')) {
                  totalMs += value * 1000;
                }
              }

              return totalMs > 0 ? totalMs : null;
            }

            function getRateLimitRetryAt(comment) {
              const body = comment.body || '';
              if (!/Review limit reached/i.test(body)) return null;

              const match = body.match(
                /Next review available in:\s*(?:\*\*)?([^*\n<]+?)(?:\*\*)?(?:\s|$)/i,
              );
              const durationMs = parseDurationToMs(match?.[1]?.trim() || '');
              if (!durationMs) return null;

              return getEffectiveTimestamp(comment) + durationMs;
            }

            function findLatestCoderabbitComment(comments) {
              return comments
                .filter(comment => comment.user?.login === coderabbitLogin)
                .sort((a, b) => getEffectiveTimestamp(b) - getEffectiveTimestamp(a))[0];
            }

            function findLatestAutoRetryComment(comments, afterTimestamp) {
              return comments
                .filter(comment => {
                  if (!comment.body?.includes(autoRetryMarker)) return false;
                  return new Date(comment.created_at).getTime() > afterTimestamp;
                })
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            }

            function createControlBody(event) {
              return [
                controlMarker,
                '```json',
                JSON.stringify(event, null, 2),
                '```',
              ].join('\n');
            }

            function parseControlEvent(comment) {
              if (!comment.body?.includes(controlMarker)) return null;
              const match = comment.body.match(/```json\s*([\s\S]*?)\s*```/i);
              if (!match) return null;

              try {
                return JSON.parse(match[1]);
              } catch (error) {
                core.warning(`Failed to parse control event comment ${comment.id}: ${error.message}`);
                return null;
              }
            }

            async function listControlEvents() {
              if (!controlTarget) return [];
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...controlTarget,
                per_page: 100,
              });
              return comments
                .map(comment => ({ comment, event: parseControlEvent(comment) }))
                .filter(item => item.event);
            }

            async function appendControlEvent(event) {
              if (!controlTarget) return;
              await github.rest.issues.createComment({
                ...controlTarget,
                body: createControlBody(event),
              });
            }

            function getGlobalGate(controlEvents) {
              let blockedUntil = 0;
              let reason = null;

              for (const { event } of controlEvents) {
                if (event?.type === 'rate_limited' && event.retry_after_at) {
                  const retryAt = new Date(event.retry_after_at).getTime();
                  if (retryAt > blockedUntil) {
                    blockedUntil = retryAt;
                    reason = `rate_limited from ${event.repo}#${event.pr_number}`;
                  }
                }
              }

              return { blockedUntil, reason };
            }

            function hasMatchingControlEvent(controlEvents, expected) {
              return controlEvents.some(({ event }) => {
                if (!event) return false;
                return (
                  event.type === expected.type &&
                  event.repo === expected.repo &&
                  event.pr_number === expected.pr_number &&
                  event.comment_id === expected.comment_id &&
                  event.comment_updated_at === expected.comment_updated_at
                );
              });
            }

            function hasRecentReviewRequest(controlEvents, prNumber, afterTimestamp) {
              return controlEvents.some(({ event }) => {
                if (!event || event.type !== 'review_requested') return false;
                if (event.repo !== currentRepoFullName || event.pr_number !== prNumber) return false;
                const requestedAt = new Date(event.requested_at || 0).getTime();
                return requestedAt > afterTimestamp;
              });
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            core.info(`Found ${openPulls.length} open pull request(s).`);
            const controlEvents = await listControlEvents();
            const globalGate = getGlobalGate(controlEvents);
            if (controlTarget) {
              core.info(
                `Loaded ${controlEvents.length} central coordination event(s) from ${controlRepoFullName}#${controlIssueNumber}.`,
              );
              if (globalGate.blockedUntil > Date.now()) {
                core.info(
                  `Global CodeRabbit gate active until ${new Date(globalGate.blockedUntil).toISOString()} (${globalGate.reason}).`,
                );
              }
            }

            for (const pr of openPulls) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const latestCoderabbitComment = findLatestCoderabbitComment(comments);
              if (!latestCoderabbitComment) {
                core.info(`PR #${pr.number}: no CodeRabbit comment yet.`);
                continue;
              }

              const effectiveAt = getEffectiveTimestamp(latestCoderabbitComment);
              const retryAt = getRateLimitRetryAt(latestCoderabbitComment);
              if (!retryAt) {
                core.info(`PR #${pr.number}: latest CodeRabbit comment is not rate-limited.`);
                continue;
              }

              const now = Date.now();
              if (now < retryAt) {
                core.info(
                  `PR #${pr.number}: waiting until ${new Date(retryAt).toISOString()} based on comment ${latestCoderabbitComment.id}.`,
                );
                const localRateLimitEvent = {
                  type: 'rate_limited',
                  repo: currentRepoFullName,
                  pr_number: pr.number,
                  comment_id: latestCoderabbitComment.id,
                  comment_updated_at: latestCoderabbitComment.updated_at || latestCoderabbitComment.created_at,
                  retry_after_at: new Date(retryAt).toISOString(),
                  observed_at: new Date().toISOString(),
                };
                if (
                  controlTarget &&
                  !hasMatchingControlEvent(controlEvents, localRateLimitEvent)
                ) {
                  await appendControlEvent(localRateLimitEvent);
                  controlEvents.push({ comment: null, event: localRateLimitEvent });
                }
                continue;
              }

              const localRateLimitEvent = {
                type: 'rate_limited',
                repo: currentRepoFullName,
                pr_number: pr.number,
                comment_id: latestCoderabbitComment.id,
                comment_updated_at: latestCoderabbitComment.updated_at || latestCoderabbitComment.created_at,
                retry_after_at: new Date(retryAt).toISOString(),
                observed_at: new Date().toISOString(),
              };
              if (
                controlTarget &&
                !hasMatchingControlEvent(controlEvents, localRateLimitEvent)
              ) {
                await appendControlEvent(localRateLimitEvent);
                controlEvents.push({ comment: null, event: localRateLimitEvent });
              }

              const refreshedGlobalGate = getGlobalGate(controlEvents);
              if (refreshedGlobalGate.blockedUntil > now) {
                core.info(
                  `PR #${pr.number}: local timer expired, but global gate remains active until ${new Date(refreshedGlobalGate.blockedUntil).toISOString()} (${refreshedGlobalGate.reason}).`,
                );
                continue;
              }

              const latestAutoRetryComment = findLatestAutoRetryComment(comments, effectiveAt);
              if (latestAutoRetryComment) {
                const latestRetryAt = new Date(latestAutoRetryComment.created_at).getTime();
                if (now - latestRetryAt < retryCooldownMs) {
                  core.info(
                    `PR #${pr.number}: auto-retry already requested at ${latestAutoRetryComment.created_at}.`,
                  );
                  continue;
                }
              }

              if (controlTarget && hasRecentReviewRequest(controlEvents, pr.number, effectiveAt)) {
                core.info(`PR #${pr.number}: central log already has a retry request after the latest CodeRabbit update.`);
                continue;
              }

              const body = [
                autoRetryMarker,
                '@coderabbitai review',
                '',
                `Triggered automatically after the latest rate-limit window expired for comment #${latestCoderabbitComment.id}.`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });

              if (controlTarget) {
                const reviewRequestedEvent = {
                  type: 'review_requested',
                  repo: currentRepoFullName,
                  pr_number: pr.number,
                  based_on_comment_id: latestCoderabbitComment.id,
                  based_on_comment_updated_at:
                    latestCoderabbitComment.updated_at || latestCoderabbitComment.created_at,
                  requested_at: new Date().toISOString(),
                };
                await appendControlEvent(reviewRequestedEvent);
                controlEvents.push({ comment: null, event: reviewRequestedEvent });
              }

              core.info(`PR #${pr.number}: posted automatic CodeRabbit retry request.`);
            }
