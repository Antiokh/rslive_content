name: Temporary OG sticker review batch 2

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  apply-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1

      - name: Apply reviewed sticker choices
        shell: python
        run: |
          from pathlib import Path
          import re

          report = Path('docs/OG_STICKER_REVIEW.md')
          text = report.read_text(encoding='utf-8')

          choices = {
              '/integration/stalni/change-address/': ('move-stuff', 'Для смены адреса ПМЖ по ревью выбран `move-stuff`: стикер с вещами и коробками передаёт сам переезд на новый адрес.'),
              '/integration/visas/': ('travel', 'Для визового раздела по ревью выбран `travel` как прямой образ поездок и визовых перемещений.'),
              '/lifestyle/': ('white-coat-snob', 'Для корня раздела «Жизнь» по ревью выбран `white-coat-snob` как характерный редакционный образ lifestyle-раздела.'),
              '/lifestyle/culture/belgrade-neighborhoods/': ('white-coat-snob', 'Для районов Белграда по ревью выбран `white-coat-snob` как городской lifestyle-образ вместо общей карты.'),
              '/lifestyle/fun/': ('karaoke', 'Для общего раздела развлечений по ревью выбран `karaoke` как более характерный образ досуга.'),
              '/lifestyle/travel/': ('travel', 'Для корня раздела путешествий по Сербии выбран канонический `travel`.'),
              '/lifestyle/travel/banje/': ('bara-luzha', 'Для поездок по сербским баням по ревью выбран `bara-luzha` — намеренно шуточный водный образ.'),
              '/lifestyle/travel/fortresses/': ('sava-selfie', 'Для туристического маршрута по крепостям выбран `sava-selfie`: поросёнок с фотоаппаратом у достопримечательности используется как общий образ поездок по местам Сербии.'),
              '/lifestyle/travel/fruska-gora-sremski-karlovci/': ('sava-selfie', 'Для конкретного туристического маршрута выбран `sava-selfie` как общий образ поездки по достопримечательностям Сербии.'),
              '/lifestyle/travel/ovcar-kablar-cacak/': ('sava-selfie', 'Для конкретного туристического маршрута выбран `sava-selfie` как общий образ поездки по достопримечательностям Сербии.'),
              '/lifestyle/travel/resava/': ('sava-selfie', 'Для конкретного туристического маршрута выбран `sava-selfie` как общий образ поездки по достопримечательностям Сербии.'),
              '/lifestyle/travel/rtanj/': ('sava-selfie', 'Для конкретного туристического маршрута выбран `sava-selfie` как общий образ поездки по достопримечательностям Сербии.'),
              '/lifestyle/travel/short-nature-trips/': ('sava-selfie', 'Для подборки коротких поездок выбран `sava-selfie` как общий образ туриста с фотоаппаратом.'),
              '/lifestyle/travel/south-banate/': ('sava-selfie', 'Для конкретного туристического маршрута выбран `sava-selfie` как общий образ поездки по достопримечательностям Сербии.'),
              '/lifestyle/travel/stari-ras-novi-pazar/': ('sava-selfie', 'Для конкретного туристического маршрута выбран `sava-selfie` как общий образ поездки по достопримечательностям Сербии.'),
              '/lifestyle/travel/vojvodina-cities/': ('sava-selfie', 'Для маршрута по городам Воеводины выбран `sava-selfie` как общий туристический образ.'),
              '/lifestyle/travel/wine-regions/': ('sava-selfie', 'Для маршрута по винным регионам выбран `sava-selfie` как общий образ туристической поездки.'),
              '/lifestyle/travel/yugoslav-spomenici/': ('sava-selfie', 'Для маршрута по югославским памятникам выбран `sava-selfie` как общий образ туриста с фотоаппаратом.'),
              '/lifestyle/travel/winter-serbia/': ('cold-weather', 'Для зимних поездок по Сербии выбран `cold-weather`, прямо соответствующий сезонной теме.'),
              '/m25/': ('joker', 'Для страницы `/m25/` по ревью выбран `joker`.'),
              '/m26/': ('joker', 'Для страницы `/m26/` по ревью выбран `joker`.'),
              '/map/dance/': ('disco', 'Для карты танцевальных мест выбран `disco` — канонический стикер с диско-тематикой.'),
              '/map/ruska_ambasada/': ('passport', 'Для карты российского посольства выбран `passport` как паспортно-консульский образ.'),
              '/map/smallrf/': ('russian-flag', 'Для карты мест русского сообщества выбран `russian-flag`.'),
              '/med/dms/': ('doctor', 'Для раздела ДМС выбран `doctor`: это медицинская страховка, поэтому медицинский образ точнее банковской карты.'),
              '/med/dms/ddor/': ('doctor', 'Для страницы ДМС страховщика выбран `doctor` как общий медицинский образ раздела.'),
              '/med/dms/dunav/': ('doctor', 'Для страницы ДМС страховщика выбран `doctor` как общий медицинский образ раздела.'),
              '/med/dms/triglav/': ('doctor', 'Для страницы ДМС страховщика выбран `doctor` как общий медицинский образ раздела.'),
              '/med/dms/uniqa/': ('doctor', 'Для страницы ДМС страховщика выбран `doctor` как общий медицинский образ раздела.'),
              '/med/dms/wiener/': ('doctor', 'Для страницы ДМС страховщика выбран `doctor` как общий медицинский образ раздела.'),
              '/med/familiar-medicines/': ('medical-morpheus', 'Для страницы привычных лекарств выбран `medical-morpheus`: канонический стикер предназначен для медикаментов и выбора лечения.'),
              '/med/medications/': ('medical-morpheus', 'Для раздела лекарств выбран `medical-morpheus`: канонический стикер предназначен для медикаментов и выбора лечения.'),
              '/move/': ('serbian-flag', 'Для корня раздела переезда выбран `serbian-flag` как прямой образ переезда именно в Сербию.'),
              '/arrival/bank/': ('atm-fee', 'Для банковского блока выбран `atm-fee` как характерный банковский стикер вместо общей платёжной карты.'),
              '/arrival/bank/adriatic/': ('atm-fee', 'Для страницы банка выбран общий банковский стикер раздела `atm-fee`.'),
              '/arrival/bank/alta/': ('atm-fee', 'Для страницы банка выбран общий банковский стикер раздела `atm-fee`.'),
              '/arrival/bank/apibanka/': ('atm-fee', 'Для страницы банка выбран общий банковский стикер раздела `atm-fee`.'),
              '/arrival/bank/posted/': ('atm-fee', 'Для страницы банка выбран общий банковский стикер раздела `atm-fee`.'),
              '/arrival/bank/raiffeisen/': ('atm-fee', 'Для страницы банка выбран общий банковский стикер раздела `atm-fee`.'),
              '/arrival/banks/': ('atm-fee', 'Для банковского справочника выбран `atm-fee` как общий банковский образ.'),
              '/move/risks/': ('russia-is-hearing', 'Для страницы «Риски для уехавших из РФ» выбран `russia-is-hearing` как тематический российский риск/наблюдение-образ.'),
              '/move/army/': ('russia-is-hearing', 'Для страницы о военной обязанности и связанных вопросах выбран `russia-is-hearing` как тематический российский образ.'),
          }

          for slug in sorted({slug for slug, _ in choices.values()}):
              for ext in ('webp', 'svg'):
                  p = Path(f'src/content/docs/about/stickers/assets/{ext}/{slug}.{ext}')
                  if not p.is_file():
                      raise SystemExit(f'missing {ext}: {p}')

          change_heading = '## Предложения, отличающиеся от текущего OG'
          inventory_heading = '## Полный инвентарь'
          comment_heading = '## Как комментировать'
          if change_heading not in text or inventory_heading not in text or comment_heading not in text:
              raise SystemExit('expected report sections not found')

          prefix, rest = text.split(change_heading, 1)
          _, rest = rest.split(inventory_heading, 1)
          inventory_body, suffix = rest.split(comment_heading, 1)

          rows = []
          seen = set()
          for line in inventory_body.strip().splitlines():
              if not line.startswith('| ') or line.startswith('| Текущий стикер') or line.startswith('|---'):
                  continue
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3:
                  raise SystemExit(f'cannot parse row: {line[:160]}')
              current, middle, target = parts
              m = re.match(r'`([^`]+)`<br><br>(.*)', middle)
              if not m:
                  raise SystemExit(f'cannot parse route/reason: {middle[:160]}')
              route, reason = m.groups()
              if route in choices:
                  slug, reason = choices[route]
                  target = f'<img src="../src/content/docs/about/stickers/assets/webp/{slug}.webp" alt="{slug}" width="120"><br><code>{slug}</code>'
                  seen.add(route)
              rows.append((current, route, reason, target))

          missing = sorted(set(choices) - seen)
          if missing:
              raise SystemExit('routes missing from inventory: ' + ', '.join(missing))

          changes = [row for row in rows if row[0] != row[3]]
          table_head = [
              '| Текущий стикер | Страница и объяснение | Предлагаемый стикер |',
              '|---|---|---|',
          ]

          def render(items):
              out = table_head.copy()
              for current, route, reason, target in items:
                  out.append(f'| {current} | `{route}`<br><br>{reason} | {target} |')
              return '\n'.join(out)

          new_text = (
              prefix.rstrip() + '\n\n'
              + change_heading + '\n\n'
              + render(changes) + '\n\n'
              + inventory_heading + '\n\n'
              + render(rows) + '\n\n'
              + comment_heading + suffix
          )
          report.write_text(new_text, encoding='utf-8')

      - name: Commit review decisions
        run: |
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: apply next OG sticker review choices"
          git push origin HEAD:agent/og-sticker-review
