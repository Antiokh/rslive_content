name: Apply travel section patch

on:
  push:
    branches:
      - agent/travel-section

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/travel-section
          fetch-depth: 0

      - name: Patch content and index
        run: |
          python <<'PY'
          from pathlib import Path

          old_url = '/lifestyle/history/stari-ras-novi-pazar/'
          new_url = '/lifestyle/travel/stari-ras-novi-pazar/'

          raska = Path('src/content/docs/lifestyle/history/raska/index.mdx')
          text = raska.read_text()
          text = text.replace(old_url, new_url)
          raska.write_text(text)

          old_article = Path('src/content/docs/lifestyle/history/stari-ras-novi-pazar/index.mdx')
          if old_article.exists():
              old_article.unlink()
              try:
                  old_article.parent.rmdir()
              except OSError:
                  pass

          index = Path('src/content/docs/CONTENT_INDEX.yml')
          text = index.read_text()
          text = text.replace(f'url: {old_url}', f'url: {new_url}')

          if 'url: /lifestyle/travel/' not in text:
              text += '''\n  - url: /lifestyle/travel/\n    title: Путешествия по Сербии\n    tags: [путешествия, туризм, маршруты, поездки, отдых]\n    aliases: [путешествия по Сербии, туризм в Сербии, маршруты по Сербии]\n    link_when:\n      - нужен маршрут для поездки по Сербии\n      - ищешь достопримечательности и направления\n      - планируешь отдых или поездку выходного дня\n    anchors: []\n'''

          if f'url: {new_url}' not in text:
              text += '''\n  - url: /lifestyle/travel/stari-ras-novi-pazar/\n    title: Стари-Рас, Нови-Пазар и Пештер\n    tags: [путешествия, Рашка, Стари-Рас, Нови-Пазар, Сопочаны, Пештер, Сјеница, ЮНЕСКО]\n    aliases: [маршрут по исторической Рашке, Нови-Пазар и Пештер, Стари-Рас и Сопочаны]\n    link_when:\n      - планируешь поездку в Нови-Пазар и окрестности\n      - нужен маршрут по памятникам Стари-Рас и Сопочаны\n      - собираешься на Пештерское плато\n    anchors: []\n'''

          index.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/temp-travel-section.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Завершить перенос раздела путешествий"
          git push origin HEAD:agent/travel-section
