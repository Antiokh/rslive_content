console.log(`Relocation wizard behavior OK: ${combinations} answer combinations, navigator AND/OR semantics, article-only builder, coverage guard, same-day state lifecycle, step actions and playground preservation contract checked.`);
''')

          # Main contract: validate questions/candidates/UI; recommendation corpus is checked through Astro Content Collection.
          write('scripts/check-relocation-wizard.mjs', r'''import fs from 'node:fs';
import path from 'node:path';
import { fileURLToPath } from 'node:url';
import { relocationWizardCandidates } from '../config/relocation-wizard-candidates.config.mjs';
import { relocationWizardPhases, relocationWizardQuestions } from '../config/relocation-wizard.config.mjs';

const here = path.dirname(fileURLToPath(import.meta.url));
const docsRoot = path.resolve(here, '../src/content/docs');
const componentPath = path.resolve(here, '../src/components/RelocationWizard.astro');
const playgroundPath = path.resolve(here, '../src/pages/playground/relocation-wizard.astro');
const errors = [];
const fail = (message) => errors.push(message);

const validateRoute = (href, label) => {
  if (typeof href !== 'string' || !/^\\/[a-z0-9_\\-/]*\\/$/.test(href)) {
    fail(`${label} has non-canonical internal route ${href}`);
    return;
  }
  const relative = href === '/' ? 'index.mdx' : `${href.slice(1)}index.mdx`;
  const target = path.resolve(docsRoot, relative);
  if (!target.startsWith(docsRoot + path.sep) && target !== path.join(docsRoot, 'index.mdx')) fail(`route escapes docs root: ${href}`);
  else if (!fs.existsSync(target)) fail(`${label} points to missing route ${href}`);
};

const questionIds = new Set();
const optionValues = new Map();
for (const question of relocationWizardQuestions) {
  if (!question.id || questionIds.has(question.id)) fail(`duplicate or empty question id: ${question.id}`);
  questionIds.add(question.id);
  if (!question.title || !Array.isArray(question.options) || question.options.length < 2) fail(`question ${question.id} needs title and at least two options`);
  const values = new Set();
  for (const option of question.options || []) {
    if (!option.value || values.has(option.value)) fail(`duplicate or empty option in ${question.id}: ${option.value}`);
    values.add(option.value);
  }
  optionValues.set(question.id, values);
}

const exactOptions = (questionId, expected, message) => {
  const actual = relocationWizardQuestions.find((question) => question.id === questionId)?.options.map((option) => option.value) || [];
  if (actual.join(',') !== expected.join(',')) fail(message || `${questionId} options must be ${expected.join(',')}`);
};

exactOptions('stage', ['planning', 'traveling', 'arrived', 'settled'], 'stage options must preserve the planning -> traveling -> arrived -> settled journey');
exactOptions('housing', ['searching', 'temporary', 'stable', 'buying']);
exactOptions('work', ['job_search', 'employee', 'freelance', 'business', 'student', 'not_working', 'unsure']);
exactOptions('pets', ['no', 'yes']);
exactOptions('vehicle', ['no', 'license', 'foreign_car', 'buy']);

const phaseIds = new Set(relocationWizardPhases.map((phase) => phase.id));
if (phaseIds.size !== relocationWizardPhases.length) fail('phase ids must be unique');
if ([...phaseIds].join(',') !== 'now,next,situation,later') fail('phase order must stay now,next,situation,later');

const expectedCandidateIds = ['travel-route', 'migration-status'];
const actualCandidateIds = relocationWizardCandidates.map((candidate) => candidate.id);
if (actualCandidateIds.join(',') !== expectedCandidateIds.join(',')) fail(`candidate set must stay exactly ${expectedCandidateIds.join(',')}`);
for (const candidate of relocationWizardCandidates) {
  if (!candidate.title || !candidate.when || !candidate.note) fail(`candidate ${candidate.id} needs title/when/note`);
  if (!Array.isArray(candidate.options) || candidate.options.length < 2) fail(`candidate ${candidate.id} needs at least two options`);
  const values = new Set();
  for (const option of candidate.options || []) {
    if (!option.value || !option.label || values.has(option.value)) fail(`candidate ${candidate.id} has invalid or duplicate option ${option.value}`);
    values.add(option.value);
  }
  if (!candidate.showWhen || typeof candidate.showWhen !== 'object' || !Object.keys(candidate.showWhen).length) fail(`candidate ${candidate.id} has no showWhen rule`);
  for (const [questionId, allowed] of Object.entries(candidate.showWhen || {})) {
    if (!questionIds.has(questionId)) fail(`candidate ${candidate.id} references unknown question ${questionId}`);
    if (!Array.isArray(allowed) || !allowed.length) fail(`candidate ${candidate.id} has empty showWhen for ${questionId}`);
    for (const value of allowed || []) {
      if (!optionValues.get(questionId)?.has(value)) fail(`candidate ${candidate.id} uses unknown ${questionId} value ${value}`);
    }
  }
  if (!Array.isArray(candidate.routes) || !candidate.routes.length) fail(`candidate ${candidate.id} must list canonical routes`);
  for (const href of candidate.routes || []) validateRoute(href, `candidate ${candidate.id}`);
}
if (relocationWizardCandidates.find((candidate) => candidate.id === 'travel-route')?.showWhen?.stage?.join(',') !== 'planning,traveling') fail('travel-route candidate must be limited to planning/traveling');
if (relocationWizardCandidates.find((candidate) => candidate.id === 'migration-status')?.showWhen?.stage?.join(',') !== 'arrived,settled') fail('migration-status candidate must be limited to arrived/settled');

const componentSource = fs.readFileSync(componentPath, 'utf8');
const playgroundSource = fs.readFileSync(playgroundPath, 'utf8');
const runtimeScript = componentSource.match(/<script>([\\s\\S]*?)<\\/script>/)?.[1] || '';
const styleSource = componentSource.match(/<style>([\\s\\S]*?)<\\/style>/)?.[1] || '';
if (!runtimeScript) fail('component runtime script was not found');
if (!styleSource) fail('component style block was not found');
if (!componentSource.includes('assertRelocationWizardRecommendationCoverage(relocationWizardRecommendations, relocationWizardQuestions)')) fail('actual article recommendation corpus must be exhaustively validated during build');
if (!runtimeScript.includes('window.localStorage')) fail('component runtime must persist same-day local state with localStorage');
for (const helper of ['localDayKey', 'readRelocationWizardState', 'writeRelocationWizardState', 'matchesRelocationWizardRule', 'relocationWizardStepState']) {
  if (!runtimeScript.includes(helper)) fail(`component runtime must use tested shared helper ${helper}`);
}
for (const duplicateStateLogic of ['const STORAGE_KEY', 'const STORAGE_VERSION', 'localStorage.getItem(', 'localStorage.setItem(', 'JSON.parse(raw)']) {
  if (runtimeScript.includes(duplicateStateLogic)) fail(`component runtime must not duplicate tested state codec; found ${duplicateStateLogic}`);
}
for (const obsolete of ['24 * 60 * 60 * 1000', 'expiresAt']) {
  if (runtimeScript.includes(obsolete)) fail(`component runtime must not use sliding 24-hour TTL semantics; found ${obsolete}`);
}
for (const forbidden of ['sessionStorage', 'dataLayer', 'gtag(', 'fetch(', 'supabase']) {
  if (runtimeScript.includes(forbidden)) fail(`component runtime must stay local-only and analytics-free; found ${forbidden}`);
}

if (!runtimeScript.includes("window.location.pathname === '/'")) fail('all-sections action must special-case the homepage');
if (!runtimeScript.includes("'[data-rslive-all-sections], #для-всех, #быстрая-навигация, #основные-сценарии, #основные-разделы'")) fail('homepage all-sections action must target preserved universal-content anchors');
if (!runtimeScript.includes('target.scrollIntoView')) fail('homepage all-sections action must scroll to preserved universal content');
if (!runtimeScript.includes("starlight-menu-button button[aria-controls=\\\"starlight__sidebar\\\"]")) fail('mobile all-sections action must reuse Starlight burger control');
if (!runtimeScript.includes("[data-panel-toggle=\\\"sidebar\\\"]")) fail('desktop all-sections action must reuse existing sidebar panel toggle');
if (!runtimeScript.includes("document.documentElement.classList.contains('rslive-hide-sidebar')")) fail('desktop all-sections action must only toggle a hidden sidebar');

if (!/\\.rw__task-check\\{[^}]*width:1\\.2rem[^}]*height:1\\.2rem[^}]*margin:0[^}]*\\}/.test(styleSource)) fail('recommendation checkbox must stay large and use zero margin for title alignment');
if (!/\\.rw__task-copy a\\{[^}]*display:block[^}]*margin:0[^}]*padding:0[^}]*line-height:1\\.35[^}]*\\}/.test(styleSource)) fail('recommendation title link must keep its local reset');
if (!/\\.rw__task-copy strong\\{[^}]*display:block[^}]*margin:0[^}]*padding:0[^}]*line-height:inherit[^}]*\\}/.test(styleSource)) fail('recommendation strong title must keep its local reset');
if (styleSource.includes('.rw__task:has(.rw__task-check:checked)')) fail('read state must not dim or recolor the whole recommendation card');
if (!styleSource.includes('.rw__form-actions [data-rw-next]{margin-left:auto}')) fail('next/final action must stay anchored right');
if (!styleSource.includes('.rw__button--primary{border-color:var(--sl-color-accent);background:var(--sl-color-accent-low);color:var(--sl-color-white)}')) fail('primary button must keep PWA accent-low visual contract');
if (!runtimeScript.includes("form.dataset.rwMode = 'edit'") || !runtimeScript.includes('questions.forEach((question) => { question.hidden = false; })')) fail('edit mode must expose the whole answer matrix at once');
if (!playgroundSource.includes('relocationWizardCandidates')) fail('playground must render candidate rows from candidate config');
if (playgroundSource.includes('const auditCandidates')) fail('playground must not keep a handwritten candidate copy');

if (errors.length) {
  console.error('Relocation wizard contract failed:');
  errors.forEach((error) => console.error(`- ${error}`));
  process.exit(1);
}

console.log(`Relocation wizard contract OK: ${relocationWizardQuestions.length} questions, article-only recommendation corpus has a build-time exhaustive guard, ${relocationWizardCandidates.length} accepted candidates, shared same-day state/matching model enabled, context-aware all-sections navigation enabled, recommendation-card UX guards intact, no remote persistence or custom analytics.`);
''')

          # Methodology: complete the rollout section instead of leaving transitional contracts active.
          rel = 'docs/components/relocation-wizard.md'
          text = read(rel)
          text = text.replace(
              '- `config/relocation-wizard.config.mjs` — вопросы, фазы и временный legacy fallback из старой JSON-матрицы;',
              '- `config/relocation-wizard.config.mjs` — вопросы и фазы;',
          )
          text = text.replace(
              '- `src/lib/relocation-wizard-recommendations.mjs` — нормализация short/OR syntax, canonical route и объединение article frontmatter с rollout fallback;',
              '- `src/lib/relocation-wizard-recommendations.mjs` — нормализация short/OR syntax, canonical route, детерминированная сборка и exhaustive coverage guard;',
          )
          text = text.replace(
              '\nLegacy JSON в `config/relocation-wizard.config.mjs` всё ещё импортируется статически. Это временный rollout fallback, а не новый редакционный источник.\n',
              '\nПосле завершения миграции отдельная JSON-матрица больше не участвует в runtime или build. Article frontmatter — единственный источник classification.\n',
          )
          start = text.find('## Rollout fallback\n')
          end = text.find('## Runtime match model\n')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('methodology rollout section not found')
          replacement = '''## Recommendation build\n\n`buildRelocationWizardRecommendations()` получает валидированные страницы Astro Content Collection и строит список только из страниц с `navigator`. Для каждой карточки автоматически выводятся canonical route, `title`, `description` и route-based `progressId`; отдельные `href`, `summary`, `reason`, `id` и order-матрица не поддерживаются.\n\nПорядок детерминирован: сначала порядок фаз `now -> next -> situation -> later`, затем canonical URL внутри фазы. Это сознательно исключает вторую вручную поддерживаемую базу порядка рекомендаций.\n\nПосле сборки `RelocationWizard.astro` запускает `assertRelocationWizardRecommendationCoverage()` на фактическом Content Collection corpus. Guard перебирает все 14 336 комбинаций ответов, запрещает пустой персональный план и одновременно видимые дубли одной статьи. Поэтому изменение frontmatter, которое ломает полноту выдачи, должно остановить Astro build.\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'Frontend получает в `data-match` либо legacy match, либо нормализованную форму:',
              'Frontend получает в `data-match` нормализованную tag-based форму:',
          )
          text = text.replace('\nLegacy question/value matcher сохранён только до удаления rollout fallback.\n', '\n')
          text = text.replace('\nНа rollout fallback существующие ids продолжают поддерживаться до миграции маршрута. Переходный one-day reset допустим и не создаёт серверной миграции состояния.\n', '\n')
          text = text.replace(
              '2. фактическую recommendation list, собранную тем же `buildRelocationWizardRecommendations()` из Content Collection + rollout fallback;\n3. AND/OR tags для frontmatter rules;\n4. продуктово принятые кандидаты будущих вопросов.',
              '2. фактическую recommendation list, собранную тем же `buildRelocationWizardRecommendations()` только из Content Collection;\n3. AND/OR tags для frontmatter rules;\n4. продуктово принятые кандидаты будущих вопросов.',
          )
          text = text.replace(
              '`check-relocation-wizard.mjs` сохраняет проверки текущего engine/fallback contract: вопросы, option values, canonical routes, обязательные сценарии, privacy boundary и UI guards.',
              '`check-relocation-wizard.mjs` сохраняет проверки engine contract: вопросы, option values, кандидаты, privacy boundary, build-time coverage hook и UI guards.',
          )
          text = text.replace(
              'Recommendation classification перенесена непосредственно в статьи. Принят компактный синтаксис: один массив — AND, несколько массивов одной фазы — OR. Route/title/description больше не дублируются в recommendation data. Astro Content Collection стал единственным parser/schema path для frontmatter, а старый JSON оставлен только как временный route-level fallback до синхронизации двух репозиториев.',
              'Recommendation classification перенесена непосредственно в статьи. Принят компактный синтаксис: один массив — AND, несколько массивов одной фазы — OR. Route/title/description больше не дублируются в recommendation data. Astro Content Collection стал единственным parser/schema path для frontmatter. После успешной синхронизации content и engine cleanup удалил временную JSON-матрицу и route-level fallback; exhaustive guard теперь проверяет фактический article-owned corpus при каждой Astro сборке.',
          )
          write(rel, text)

          # Hard guard: no active code/doc references to the removed source remain in edited surfaces.
          for rel in [
              'config/relocation-wizard.config.mjs',
              'src/components/RelocationWizard.astro',
              'src/pages/playground/relocation-wizard.astro',
              'src/lib/relocation-wizard-recommendations.mjs',
              'scripts/check-relocation-wizard-content-source.mjs',
          ]:
              if 'relocation-wizard.json' in read(rel):
                  raise SystemExit(f'{rel} still references relocation-wizard.json')
          PY

      - name: Install dependencies
        working-directory: engine/astro
        run: npm ci

      - name: Test RelocationWizard
        working-directory: engine/astro
        run: npm run test:relocation-wizard

      - name: Commit engine cleanup
        working-directory: engine
        run: |
          set -euo pipefail
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add astro/config/relocation-wizard.config.mjs \
            astro/src/lib/relocation-wizard-recommendations.mjs \
            astro/src/components/RelocationWizard.astro \
            astro/src/pages/playground/relocation-wizard.astro \
            astro/scripts/check-relocation-wizard.mjs \
            astro/scripts/check-relocation-wizard-content-source.mjs \
            astro/scripts/check-relocation-wizard-behavior.mjs \
            astro/docs/components/relocation-wizard.md
          git diff --cached --check
          git commit -m "Удалить legacy fallback RelocationWizard"
          git push origin HEAD:agent/relocation-wizard-remove-fallback
