if (!recommendationsSource.includes('progressId: href')) fail('frontmatter read progress must use the canonical article route');
if (!recommendationsSource.includes("id: `navigator:${href}:${phase}`")) fail('recommendation ids must be derived, not authored separately');
if (!recommendationsSource.includes('assertRelocationWizardRecommendationCoverage')) fail('builder module must expose exhaustive coverage validation');

