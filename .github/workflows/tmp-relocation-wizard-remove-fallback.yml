name: Temporary RelocationWizard fallback cleanup

on:
  push:
    branches:
      - agent/relocation-wizard-remove-fallback

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Checkout engine cleanup branch
        uses: actions/checkout@v4
        with:
          repository: Antiokh/rslive.ru
          ref: agent/relocation-wizard-remove-fallback
          token: ${{ secrets.RSLIVE_CONTENT_SYNC_TOKEN }}
          path: engine
          fetch-depth: 0

      - name: Remove rollout fallback
        run: python3 scripts/tmp-relocation-wizard-remove-fallback.py

      - name: Install dependencies
        working-directory: engine/astro
        run: npm ci

      - name: Test RelocationWizard
        working-directory: engine/astro
        run: npm run test:relocation-wizard

      - name: Commit engine cleanup
        working-directory: engine
        run: |
          set -euo pipefail
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add astro/config/relocation-wizard.config.mjs \
            astro/src/lib/relocation-wizard-recommendations.mjs \
            astro/src/components/RelocationWizard.astro \
            astro/src/pages/playground/relocation-wizard.astro \
            astro/scripts/check-relocation-wizard.mjs \
            astro/scripts/check-relocation-wizard-content-source.mjs \
            astro/scripts/check-relocation-wizard-behavior.mjs \
            astro/docs/components/relocation-wizard.md
          git diff --cached --check
          git commit -m "Удалить legacy fallback RelocationWizard"
          git push origin HEAD:agent/relocation-wizard-remove-fallback
