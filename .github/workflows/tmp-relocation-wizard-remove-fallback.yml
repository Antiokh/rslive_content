const methodologyPath = path.resolve(here, '../docs/components/relocation-wizard.md');
const errors = [];
const fail = (message) => errors.push(message);

const configSource = fs.readFileSync(configPath, 'utf8');
if (configSource.includes('relocation-wizard.json') || configSource.includes('relocationWizardRecommendations')) {
  fail('engine config must contain only questions/phases; recommendation JSON fallback is removed');
}

const tagsSource = fs.readFileSync(tagsPath, 'utf8');
if (!relocationWizardNavigatorTags.includes('before-arrival')) fail('navigator tag registry must contain derived before-arrival');
if (!relocationWizardNavigatorTags.includes('car')) fail('navigator tag registry must contain derived car');
if (!tagsSource.includes("both: Object.freeze(['preschool-age', 'school-age'])")) {
  fail('family=both must activate both preschool-age and school-age tags');
}
if (!tagsSource.includes("foreign_car: Object.freeze(['foreign-license', 'foreign-car', 'car', 'driving'])")) {
