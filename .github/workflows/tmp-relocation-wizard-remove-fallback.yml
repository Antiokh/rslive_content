assert.deepEqual(sameDay?.read, ['/move/travel/', '/arrival/mobile/']);
assert.equal(readRelocationWizardState(storage, '2026-08-28'), null);
assert.deepEqual(storage.dump(), {});
assert.equal(parseRelocationWizardState('{not-json', today), null);
assert.equal(readRelocationWizardState(throwingStorage, today), null);
assert.equal(writeRelocationWizardState(throwingStorage, { profile: null, read: [] }, today), false);

assert.deepEqual(normalizeRelocationWizardNavigatorPhase(['traveling', 'pets']), [['traveling', 'pets']]);
