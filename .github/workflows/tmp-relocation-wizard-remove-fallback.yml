assert.equal(syntheticRecommendations.length, 1);
assert.equal(syntheticRecommendations[0].href, '/move/pets/');
assert.equal(syntheticRecommendations[0].progressId, '/move/pets/');
assert.equal(syntheticRecommendations[0].title, 'Питомцы');
assert.equal(syntheticRecommendations[0].summary, 'Документы и поездка с питомцем.');
