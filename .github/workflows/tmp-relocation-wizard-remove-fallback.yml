const fakeStorage = (initial = {}) => {
  const values = new Map(Object.entries(initial));
  return {
    getItem(key) { return values.has(key) ? values.get(key) : null; },
    setItem(key, value) { values.set(key, String(value)); },
    removeItem(key) { values.delete(key); },
    dump() { return Object.fromEntries(values); },
  };
};

const throwingStorage = {
  getItem() { throw new Error('blocked'); },
  setItem() { throw new Error('blocked'); },
  removeItem() { throw new Error('blocked'); },
};

const first = relocationWizardStepState({ index: 0, total: relocationWizardQuestions.length, answered: false });
assert.equal(first.backHidden, true);
assert.equal(first.nextDisabled, true);
assert.equal(first.nextLabel, 'Дальше');
assert.equal(first.stepLabel, `Шаг 1 из ${relocationWizardQuestions.length}`);

const middle = relocationWizardStepState({ index: 1, total: relocationWizardQuestions.length, answered: true });
assert.equal(middle.backHidden, false);
assert.equal(middle.nextDisabled, false);
assert.equal(middle.nextLabel, 'Дальше');

const last = relocationWizardStepState({ index: relocationWizardQuestions.length - 1, total: relocationWizardQuestions.length, answered: true });
assert.equal(last.nextLabel, 'Завершить и показать результаты');
assert.equal(last.progressPercent, 100);

const today = '2026-08-27';
const storage = fakeStorage();
assert.equal(writeRelocationWizardState(storage, {
  profile: { answers: { stage: 'traveling', stay: 'temporary' } },
  read: ['/move/travel/', '/move/travel/', '/arrival/mobile/'],
