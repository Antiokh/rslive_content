name: Temporary RelocationWizard fallback cleanup

on:
  push:
    branches:
      - agent/relocation-wizard-remove-fallback

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Checkout engine cleanup branch
        uses: actions/checkout@v4
        with:
          repository: Antiokh/rslive.ru
          ref: agent/relocation-wizard-remove-fallback
          token: ${{ secrets.RSLIVE_CONTENT_SYNC_TOKEN }}
          path: engine
          fetch-depth: 0

      - name: Remove rollout fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('engine/astro')

          def read(rel):
              return (root / rel).read_text(encoding='utf-8')

          def write(rel, value):
              (root / rel).write_text(value, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # config: questions/phases only; recommendation classification is article-owned.
          rel = 'config/relocation-wizard.config.mjs'
          text = read(rel)
          text = replace_once(
              text,
              "import relocationWizardRecommendationMatrix from '../src/content/docs/_data/relocation-wizard.json' with { type: 'json' };\n\n",
              '',
              'legacy JSON import',
          )
          marker = '\nfunction freezeRecommendation(item) {'
          if marker not in text:
              raise SystemExit('legacy recommendation loader marker missing')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          write(rel, text)

          # Pure article-frontmatter builder and exhaustive coverage guard.
          write('src/lib/relocation-wizard-recommendations.mjs', r'''import { selectRelocationWizardRecommendations } from './relocation-wizard-model.mjs';

export const DEFAULT_RELOCATION_WIZARD_PHASE_IDS = Object.freeze(['now', 'next', 'situation', 'later']);

export function relocationWizardRouteForPageId(id) {
  let value = String(id || '').replace(/^\\/+|\\/+$/g, '');
  if (!value || value === 'index') return '/';
  if (value.endsWith('/index')) value = value.slice(0, -'/index'.length);
  return `/${value}/`;
}

export function normalizeRelocationWizardNavigatorPhase(value, label = 'navigator phase') {
  if (!Array.isArray(value) || value.length === 0) {
    throw new TypeError(`${label} must be a non-empty array.`);
  }

  if (value.every((item) => typeof item === 'string')) return [value];
  if (value.every((item) => Array.isArray(item) && item.length > 0 && item.every((tag) => typeof tag === 'string'))) {
    return value;
  }

  throw new TypeError(`${label} must be [tag, ...] or [[tag, ...], [tag, ...]].`);
}

function freezeMatchClauses(clauses) {
  return Object.freeze({
    __navigatorClauses: Object.freeze(clauses.map((clause) => Object.freeze([...clause]))),
  });
}

export function buildRelocationWizardRecommendations(
  pages = [],
  phaseIds = DEFAULT_RELOCATION_WIZARD_PHASE_IDS,
) {
  const phaseOrder = new Map(phaseIds.map((phase, index) => [phase, index]));
  const recommendations = [];

  for (const page of pages || []) {
    const navigator = page?.data?.navigator;
    if (!navigator || typeof navigator !== 'object' || Array.isArray(navigator)) continue;

    const href = relocationWizardRouteForPageId(page.id);
    if (href === '/en/' || href.startsWith('/en/') || href === '/sr/' || href.startsWith('/sr/')) continue;

    const title = page?.data?.title;
    const summary = page?.data?.description;
    if (typeof title !== 'string' || title.trim() === '') {
      throw new TypeError(`RelocationWizard page ${href} must have a non-empty title.`);
    }
    if (typeof summary !== 'string' || summary.trim() === '') {
      throw new TypeError(`RelocationWizard page ${href} must have a non-empty description.`);
    }

    for (const [phase, value] of Object.entries(navigator)) {
      if (!phaseOrder.has(phase)) throw new TypeError(`Unknown RelocationWizard phase ${phase} for ${href}.`);
      const clauses = normalizeRelocationWizardNavigatorPhase(value, `${href} navigator.${phase}`);
      recommendations.push(Object.freeze({
        id: `navigator:${href}:${phase}`,
        progressId: href,
        href,
        title,
        summary,
        phase,
        match: freezeMatchClauses(clauses),
      }));
    }
  }

  recommendations.sort((a, b) => {
    const phaseDelta = phaseOrder.get(a.phase) - phaseOrder.get(b.phase);
    return phaseDelta || a.href.localeCompare(b.href);
  });
  return Object.freeze(recommendations);
}

export function assertRelocationWizardRecommendationCoverage(recommendations, questions) {
  if (!Array.isArray(recommendations) || recommendations.length === 0) {
    throw new Error('RelocationWizard must contain at least one frontmatter recommendation.');
  }
  if (!Array.isArray(questions) || questions.length === 0) {
    throw new Error('RelocationWizard must contain at least one question.');
  }

  let combinations = 0;
  const walk = (index, answers) => {
    if (index === questions.length) {
      combinations += 1;
      const selected = selectRelocationWizardRecommendations(recommendations, answers);
      if (selected.length === 0) {
        throw new Error(`RelocationWizard has an empty plan for ${JSON.stringify(answers)}.`);
      }
      const progressIds = selected.map((item) => item.progressId);
      if (new Set(progressIds).size !== progressIds.length) {
        throw new Error(`RelocationWizard has duplicate article recommendations for ${JSON.stringify(answers)}.`);
      }
      return;
    }

    const question = questions[index];
    const values = (question?.options || []).map((option) => option?.value).filter(Boolean);
    if (!question?.id || values.length === 0) {
      throw new Error(`RelocationWizard question at index ${index} has no id or options.`);
    }
    for (const value of values) walk(index + 1, { ...answers, [question.id]: value });
  };

  walk(0, {});
  return combinations;
}
''')

