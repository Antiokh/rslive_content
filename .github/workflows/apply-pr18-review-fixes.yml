name: Apply PR 18 review fixes

on:
  push:
    branches:
      - agent/add-practical-life-guides
    paths:
      - .github/workflows/apply-pr18-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-practical-life-guides
          fetch-depth: 0

      - name: Apply exact replacements
        run: python scripts/apply_pr18_review_fixes.py

      - name: Commit content fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/CONTENT_INDEX.yml \
                  src/content/docs/arrival/post/index.mdx \
                  src/content/docs/gov/notary/index.mdx
          git commit -m "fix: address remaining PR 18 review comments"

      - name: Remove one-shot files
        run: |
          git rm scripts/apply_pr18_review_fixes.py .github/workflows/apply-pr18-review-fixes.yml
          git commit -m "chore: remove one-shot PR 18 fixer"

      - name: Push fixes
        run: git push origin HEAD:agent/add-practical-life-guides
