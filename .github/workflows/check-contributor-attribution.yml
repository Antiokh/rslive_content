name: Check contributor attribution

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    runs-on: ubuntu-latest

    steps:
      - name: Reject AI tools in authorship metadata
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            )

            const forbiddenIdentityPatterns = [
              /\bClaude(?:\s+(?:Code|Fable)(?:\s+\d+)?)?\b/i,
              /\bChatGPT\b/i,
              /\b(?:OpenAI\s+)?Codex\b/i,
              /\bGitHub\s+Copilot\b/i,
              /\b(?:Google\s+)?Gemini\b/i,
              /(?:^|[<\s])[^<>\s]+@anthropic\.com(?:>|$)/i,
              /(?:^|[<\s])[^<>\s]+@openai\.com(?:>|$)/i
            ]

            const isForbiddenIdentity = (value) =>
              forbiddenIdentityPatterns.some((pattern) => pattern.test(value || ''))

            const violations = new Set()

            for (const commit of commits) {
              const shortSha = commit.sha.slice(0, 7)
              const metadata = [
                ['Author', commit.commit.author],
                ['Committer', commit.commit.committer]
              ]

              for (const [field, identity] of metadata) {
                const value = `${identity?.name || ''} <${identity?.email || ''}>`
                if (isForbiddenIdentity(value)) {
                  violations.add(`${shortSha} — ${field}: ${value}`)
                }
              }

              const message = commit.commit.message || ''
              const trailerPattern = /^([A-Za-z][A-Za-z0-9-]*):\s*(.+)$/gm
              let match

              while ((match = trailerPattern.exec(message)) !== null) {
                const key = match[1].toLowerCase()
                const value = match[2].trim()
                const isAuthorshipTrailer =
                  key === 'author' || key === 'committer' || key.endsWith('-by')

                if (isAuthorshipTrailer && isForbiddenIdentity(value)) {
                  violations.add(`${shortSha} — ${match[1]}: ${value}`)
                }
              }
            }

            if (violations.size > 0) {
              core.setFailed(
                [
                  'AI-инструменты нельзя указывать в Author, Committer или trailers авторства.',
                  'Удалите AI-идентичность, сохраните реального автора и при необходимости упомяните инструмент в описании PR.',
                  '',
                  ...Array.from(violations, (item) => `- ${item}`),
                  '',
                  'Правила: docs/CONTRIBUTOR_ATTRIBUTION.md'
                ].join('\n')
              )
            }
