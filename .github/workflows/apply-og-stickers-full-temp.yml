name: Temporary apply full OG sticker inventory

on:
  push:
    branches:
      - agent/apply-og-stickers-full

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-og-stickers-full
          fetch-depth: 0

      - name: Fetch approved review inventory
        run: |
          git fetch origin agent/og-sticker-review:refs/remotes/origin/agent/og-sticker-review
          git show origin/agent/og-sticker-review:docs/OG_STICKER_REVIEW.md > /tmp/OG_STICKER_REVIEW.md

      - name: Apply every real difference from full inventory
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('src/content/docs')
          review = Path('/tmp/OG_STICKER_REVIEW.md').read_text(encoding='utf-8')

          marker = '## Полный инвентарь'
          tail_marker = '## Как комментировать'
          if marker not in review or tail_marker not in review:
              raise SystemExit('full inventory section not found')
          inventory = review.split(marker, 1)[1].split(tail_marker, 1)[0]

          def route_for(path: Path):
              rel = path.relative_to(root)
              if rel.name in ('index.mdx', 'index.md'):
                  parent = rel.parent.as_posix()
                  return '/' if parent == '.' else f'/{parent}/'
              return '/' + rel.with_suffix('').as_posix() + '/'

          route_files = {}
          for pattern in ('*.mdx', '*.md'):
              for path in root.rglob(pattern):
                  route_files[route_for(path)] = path

          decisions = {}
          row_re = re.compile(r'^\| .*? \| `([^`]+)`<br><br>.*? \| (.*?) \|$', re.M)
          for m in row_re.finditer(inventory):
              route, target_cell = m.groups()
              codes = re.findall(r'<code>([^<]+)</code>', target_cell)
              if not codes:
                  continue
              target = codes[-1].strip()
              if '→' in target:
                  target = target.split('→', 1)[1].strip()
              if target in {'—', ''}:
                  continue
              decisions[route] = target

          # Latest explicit user decision: moustached Heisenberg, not crystal icon.
          decisions['/integration/social/'] = 'heisenberg'

          if len(decisions) < 250:
              raise SystemExit(f'suspiciously small full inventory parse: {len(decisions)} decisions')

          changed = []
          skipped_engine = []
          missing_assets = []
          for route, target in sorted(decisions.items()):
              path = route_files.get(route)
              if path is None:
                  skipped_engine.append(route)
                  continue

              webp = root / 'about/stickers/assets/webp' / f'{target}.webp'
              svg = root / 'about/stickers/assets/svg' / f'{target}.svg'
              if not webp.is_file() or (target != 'pig-in-bushes' and not svg.is_file()):
                  missing_assets.append((route, target, str(webp), str(svg)))
                  continue

              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'frontmatter opening missing: {path}')
              end = text.find('\n---\n', 4)
              if end < 0:
                  raise SystemExit(f'frontmatter closing missing: {path}')

              fm = text[4:end]
              body = text[end + 5:]
              mm = re.search(r'(?m)^ogSticker:\s*["\']?([^"\'\n]+)["\']?\s*$', fm)
              explicit = mm.group(1).strip() if mm else None
              effective = explicit or 'giant-book'
              if effective == target:
                  continue

              if mm:
                  fm2 = re.sub(r'(?m)^ogSticker:\s*.*$', f'ogSticker: {target}', fm, count=1)
              else:
                  fm2 = fm.rstrip('\n') + f'\nogSticker: {target}'

              new_text = '---\n' + fm2.rstrip('\n') + '\n---\n' + body
              path.write_text(new_text, encoding='utf-8')
              changed.append((route, explicit or '(fallback giant-book)', target, str(path)))

          if missing_assets:
              for item in missing_assets:
                  print('MISSING ASSET', item)
              raise SystemExit(f'{len(missing_assets)} missing sticker asset sets')

          if len(changed) < 100:
              raise SystemExit(f'suspiciously small change set: {len(changed)} files')

          out = Path('/tmp/og-sticker-changes.tsv')
          out.write_text('\n'.join('\t'.join(x) for x in changed) + '\n', encoding='utf-8')
          print(f'Parsed full inventory decisions: {len(decisions)}')
          print(f'Changed files: {len(changed)}')
          print(f'Engine/non-MDX skipped: {len(skipped_engine)} {skipped_engine}')
          print('Explicit social override: /integration/social/ -> heisenberg')
          print(out.read_text(encoding='utf-8'))

      - name: Verify diff shape
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          bad = []
          out = subprocess.check_output(['git','diff','--numstat','--','src/content/docs'], text=True)
          for line in out.splitlines():
              a, d, path = line.split('\t', 2)
              if not (a == '1' and d in {'0','1'}):
                  bad.append(line)
          if bad:
              raise SystemExit('Unexpected non-metadata diff shape:\n' + '\n'.join(bad))
          print(f'Frontmatter-only diff shape verified for {len(out.splitlines())} files')
          PY

      - name: Commit complete OG sticker application
        run: |
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git rm .github/workflows/apply-og-stickers-full-temp.yml
          git add src/content/docs
          git commit -m "docs: apply reviewed OG stickers across full inventory"
          git push origin HEAD:agent/apply-og-stickers-full
