name: Agent patch school content index

on:
  push:
    branches:
      - agent/school-belgrade-guide
    paths:
      - .github/workflows/agent-patch-school-index.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/school-belgrade-guide
          fetch-depth: 0

      - name: Patch CONTENT_INDEX.yml and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/content/docs/CONTENT_INDEX.yml')
          text = path.read_text(encoding='utf-8')

          old = '''  # ==== EDUCATION ====
          - url: /edu/
            title: Образование
            tags: [образование, учёба, школа, университет, студент]
            aliases: [образование, учёба]
            link_when:
              - ищешь образовательные учреждения
              - вопросы об учёбе
            anchors: []
          '''

          new = '''  # ==== EDUCATION ====
          - url: /edu/
            title: Образование
            tags: [образование, учёба, школа, университет, студент]
            aliases: [образование, учёба]
            link_when:
              - ищешь образовательные учреждения
              - вопросы об учёбе
            anchors: []

          - url: /edu/school/
            title: Школьное образование
            tags: [школа, образование, ребёнок, основная школа, средняя школа, гимназия]
            aliases: [школа в Сербии, школьное образование, основна школа, средняя школа]
            link_when:
              - нужен общий обзор школьной системы Сербии
              - ребёнок переезжает или учится в Сербии
              - нужно выбрать школьную процедуру
            anchors: []

          - url: /edu/school/enrollment/
            title: Зачисление ребёнка в школу
            tags: [школа, зачисление, нострификация, признание, иностранный ребёнок, первый класс]
            aliases: [записать ребёнка в школу, нострификация школьных документов, признание школьных документов]
            link_when:
              - иностранного ребёнка нужно записать в сербскую школу
              - ребёнок переезжает посреди учебного года
              - нужно признать иностранные школьные документы
              - нужно определить класс после иностранной школы
            anchors: []

          - url: /edu/school/secondary-admission/
            title: Поступление в среднюю школу
            tags: [малая матура, средняя школа, гимназия, lista želja, preko broja, поступление]
            aliases: [поступление после 8 класса, малая матура, lista želja, preko broja]
            link_when:
              - ребёнок заканчивает 8 класс
              - нужно посчитать конкурсные баллы
              - нужно заполнить список желаний
              - последний класс основной школы закончен за границей
              - нужен специальный вступительный экзамен
            anchors: []

          - url: /edu/school/international/
            title: Школы с несербскими программами
            tags: [частная школа, международная школа, русская школа, английская школа, Cambridge, Белград]
            aliases: [русская школа в Белграде, международная школа в Белграде, школа на английском]
            link_when:
              - нужна школа с русской, английской, немецкой или французской программой
              - нужно проверить лицензию или аккредитацию частной школы
              - ребёнок не будет учиться по обычной сербской программе
            anchors: []

          - url: /edu/school/languages/
            title: Языки и адаптация в школе
            tags: [сербский язык, иностранный ученик, русский язык, второй иностранный, адаптация]
            aliases: [сербский для школьника, русский как второй иностранный, адаптация ребёнка в школе]
            link_when:
              - ребёнок не знает сербский
              - нужен русский как второй иностранный язык
              - нужно помочь ребёнку адаптироваться к сербской школе
            anchors: []

          - url: /edu/school/daily-life/
            title: Школьный режим и быт
            tags: [школа, смены, каникулы, пропуски, eDnevnik, учебники, школьный быт]
            aliases: [смены в школе, школьные каникулы, электронный дневник, школьные принадлежности]
            link_when:
              - нужны смены, каникулы или правила пропусков
              - нужен eDnevnik для иностранного ребёнка
              - нужно понять школьные документы, питание или принадлежности
            anchors: []

          - url: /edu/school/resources/
            title: Школьные ресурсы
            tags: [малая матура, олимпиады, учебники, eVežbaonica, буллинг, безопасность]
            aliases: [подготовка к малой матуре, школьные олимпиады, Čuvam te, Pronađi me]
            link_when:
              - нужны тесты и материалы для подготовки
              - нужны календарь олимпиад или архивы заданий
              - нужно понять порядок действий при школьном насилии
              - нужен алгоритм при пропаже ребёнка
            anchors: []
          '''

          if old not in text:
              raise SystemExit('Expected EDUCATION block not found; refusing to rewrite index')
          if '/edu/school/resources/' in text:
              raise SystemExit('School routes already present; refusing duplicate insertion')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/agent-patch-school-index.yml').unlink()
          PY

          git config user.name "rslive-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update school routes in content index"
          git push origin HEAD:agent/school-belgrade-guide
