name: Temporary OG sticker review comments 2

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  apply-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1

      - name: Apply reviewer sticker choices
        shell: python
        run: |
          from pathlib import Path
          import re

          report = Path('docs/OG_STICKER_REVIEW.md')
          text = report.read_text(encoding='utf-8')

          exact = {
              '/gov/law/license/tourist/': 'bus',
              '/gov/notguilty/': 'wizard',
              '/gov/ombudsman/': 'lawyer',
              '/gov/uverenje_boravak/': 'wizard',
              '/integration/': 'seljak',
              '/integration/apostil/': 'wizard',
              '/integration/dresscode/': 'businessman',
              '/integration/driver_license/': 'id',
              '/integration/euprava/': 'eid',
              '/integration/passport/': 'citizenship',
              '/integration/prijavastranca/': 'eid',
          }

          reasons = {
              '/gov/law/license/tourist/': 'Для туристической лицензии по ревью используем `bus`: туристический транспорт даёт более узнаваемый отраслевой образ.',
              '/gov/notguilty/': 'Для справки о несудимости выбран `wizard`: намеренно ироничный образ бюрократической «магии документов».',
              '/gov/ombudsman/': 'Омбудсман защищает права граждан и разбирает обращения; по ревью используем юридический стикер `lawyer`.',
              '/gov/uverenje_boravak/': 'Для уверения о боравку выбран `wizard`: документальная процедура получает тот же ироничный образ «магии справок».',
              '/integration/': 'Корень раздела интеграции по ревью получает `seljak` — намеренный локальный сербский образ вместо нейтрального административного.',
              '/integration/apostil/': 'Апостиль — ещё одна формальная документальная процедура; по ревью используем `wizard` как образ «магии документов».',
              '/integration/dresscode/': 'Для делового дресс-кода выбран `businessman` — хрюшка в костюме прямо соответствует теме одежды для деловой среды.',
              '/integration/driver_license/': 'Водительское удостоверение — идентификационный документ; по ревью используем `id`.',
              '/integration/euprava/': 'eUprava — электронные государственные услуги и идентификация; `eid` даёт прямую цифровую административную привязку.',
              '/integration/passport/': 'Страница посвящена гражданству и сербскому паспорту; используем канонический `citizenship`.',
              '/integration/prijavastranca/': 'Онлайн-регистрация иностранца идёт через электронный государственный сервис; по ревью используем `eid`.',
          }

          tax_reason = 'По ревью весь раздел `/gov/taxes/*` маркируем `calculation`: поросёнок со счётами становится единым визуальным образом налогов, расчётов и обязательств.'

          webp_dir = Path('src/content/docs/about/stickers/assets/webp')
          svg_dir = Path('src/content/docs/about/stickers/assets/svg')
          slugs = set(exact.values()) | {'calculation'}
          for slug in slugs:
              if not (webp_dir / f'{slug}.webp').is_file():
                  raise SystemExit(f'missing WebP: {slug}')
              if not (svg_dir / f'{slug}.svg').is_file():
                  raise SystemExit(f'missing SVG: {slug}')

          change_heading = '## Предложения, отличающиеся от текущего OG'
          inventory_heading = '## Полный инвентарь'
          comment_heading = '## Как комментировать'
          if change_heading not in text or inventory_heading not in text or comment_heading not in text:
              raise SystemExit('expected report sections not found')

          prefix, rest = text.split(change_heading, 1)
          _, rest = rest.split(inventory_heading, 1)
          inventory_body, suffix = rest.split(comment_heading, 1)

          lines = inventory_body.strip().splitlines()
          row_lines = [line for line in lines if line.startswith('| ') and not line.startswith('| Текущий стикер') and not line.startswith('|---')]

          def parse_row(line):
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3:
                  raise ValueError(f'cannot parse row: {line[:160]}')
              current, middle, target = parts
              m = re.match(r'`([^`]+)`<br><br>(.*)', middle)
              if not m:
                  raise ValueError(f'cannot parse route/reason: {middle[:160]}')
              return current, m.group(1), m.group(2), target

          def sticker_cell(slug):
              return f'<img src="../src/content/docs/about/stickers/assets/webp/{slug}.webp" alt="{slug}" width="120"><br><code>{slug}</code>'

          inventory = []
          seen_exact = set()
          tax_routes = []
          for line in row_lines:
              current, route, reason, target = parse_row(line)
              if route in exact:
                  target = sticker_cell(exact[route])
                  reason = reasons[route]
                  seen_exact.add(route)
              if route == '/gov/taxes/' or route.startswith('/gov/taxes/'):
                  target = sticker_cell('calculation')
                  reason = tax_reason
                  tax_routes.append(route)
              inventory.append((current, route, reason, target))

          missing = sorted(set(exact) - seen_exact)
          if missing:
              raise SystemExit('review routes missing from inventory: ' + ', '.join(missing))
          if not tax_routes:
              raise SystemExit('no /gov/taxes/ routes found in inventory')

          changes = [row for row in inventory if row[0] != row[3]]

          table_head = [
              '| Текущий стикер | Страница и объяснение | Предлагаемый стикер |',
              '|---|---|---|',
          ]

          def render(rows):
              out = table_head.copy()
              for current, route, reason, target in rows:
                  out.append(f'| {current} | `{route}`<br><br>{reason} | {target} |')
              return '\n'.join(out)

          new_text = (
              prefix.rstrip() + '\n\n'
              + change_heading + '\n\n'
              + render(changes) + '\n\n'
              + inventory_heading + '\n\n'
              + render(inventory) + '\n\n'
              + comment_heading + suffix
          )
          report.write_text(new_text, encoding='utf-8')
          print(f'Applied {len(exact)} exact reviewer choices and {len(tax_routes)} tax routes')

      - name: Commit review decisions
        run: |
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: extend OG sticker review choices"
          git push origin HEAD:agent/og-sticker-review
