name: Agent sticker format cleanup

on:
  push:
    branches:
      - agent/add-new-stickers

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-new-stickers
          fetch-depth: 0

      - name: Remove obsolete PNG sticker copies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/content/docs/about/stickers/assets/png
          test ! -d src/content/docs/about/stickers/assets/png
          ! find src/content/docs/about/stickers/assets -type f -name '*.png' -print -quit | grep -q .

          git add -A src/content/docs/about/stickers/assets/png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --cached --quiet; then
            echo 'No PNG sticker copies remain.'
            exit 0
          fi

          git commit -m 'Удалить устаревшие PNG-копии стикеров'
          git push origin HEAD:agent/add-new-stickers
