name: Обновить отзывы редколлегии после изменения main

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dispatcher never executes PR content and only triggers the trusted reviewer.
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: rslive-humanizer-base-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Повторная проверка открытых PR к main
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', base: 'main', per_page: 100,
            });
            const ownerRepo = context.repo.owner + '/' + context.repo.repo;
            const failures = [];
            for (const pr of prs) {
              if (pr.state !== 'open' || pr.base?.ref !== 'main' ||
                  pr.head?.repo?.full_name !== ownerRepo ||
                  pr.user?.login === 'dependabot[bot]') continue;
              let sent = false;
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner, repo: context.repo.repo,
                    workflow_id: 'humanizer-russian-review.yml',
                    ref: 'main', inputs: { pr_number: String(pr.number) },
                  });
                  sent = true;
                  break;
                } catch (error) {
                  lastError = error;
                  if (attempt === 3 || ![429, 502, 503, 504].includes(error.status)) break;
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
              if (!sent) {
                failures.push(pr.number);
                core.warning('Не удалось обновить PR #' + pr.number + ': ' + lastError.message);
                continue;
              }
              core.info('Отзыв запрошен для PR #' + pr.number);
            }
            if (failures.length) {
              core.setFailed('Не удалось обновить PR: ' + failures.join(', '));
            }
