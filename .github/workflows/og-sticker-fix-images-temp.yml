name: Temporary OG sticker image path fix

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1
      - name: Fix preview URLs
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/OG_STICKER_REVIEW.md')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/Antiokh/rslive.ru/main/astro/src/assets/stickers/'
          new = 'https://raw.githubusercontent.com/Antiokh/rslive_content/main/src/content/docs/about/stickers/assets/webp/'
          if old not in s:
              raise SystemExit('old preview base not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit fixed previews
        run: |
          git config user.name "rslive-og-audit"
          git config user.email "actions@github.com"
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: fix OG sticker preview paths"
          git push origin HEAD:agent/og-sticker-review
