name: Temporary CONTENT_INDEX phrase restoration

on:
  push:
    branches:
      - agent/content-index-full-audit

permissions:
  contents: write

concurrency:
  group: content-index-phrase-restore
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: agent/content-index-full-audit
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install YAML parser
        run: npm install --prefix tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Restore phrase-level semantics
        run: node tools/content-quality/tmp-restore-content-index-phrases.mjs

      - name: Validate generated projection
        run: |
          node tools/content-quality/generate-content-index.mjs
          node tools/content-quality/lint-content.mjs

      - name: Commit content metadata
        run: |
          set -euo pipefail
          git add src/content/docs
          if git diff --cached --quiet; then
            echo "No content metadata changes required."
            exit 0
          fi
          git config user.name "rslive-content-audit"
          git config user.email "actions@github.com"
          git commit -m "fix: restore legacy CONTENT_INDEX phrase semantics"
          git push origin HEAD:agent/content-index-full-audit
