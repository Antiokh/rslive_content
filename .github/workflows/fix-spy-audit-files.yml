name: Repair Spy audit patch

on:
  push:
    branches: [agent/spy-audit-2026-08-15]
    paths:
      - '.github/workflows/fix-spy-audit-files.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild modified long files from current main
        shell: python
        run: |
          import pathlib
          import subprocess

          def main_text(path):
              return subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'], text=True
              )

          business_path = pathlib.Path('src/content/docs/arrival/business/index.mdx')
          business = main_text(str(business_path))
          business = business.replace(
              '- [Электронная коммерция](/arrival/business/e-comm/) — дополнительные требования для онлайн-продаж.',
              '- [Электронная коммерция](/arrival/business/e-comm/) — дополнительные требования для онлайн-продаж.\n- [eFaktura и SEF](/arrival/business/efaktura/) — электронные фактуры, пользователи системы и работа с государственными/частными контрагентами.'
          )
          business = business.replace(
              '3. Настройте доступ к [ePorezi](/gov/taxes/eporezi/) и электронным сообщениям.',
              '3. Настройте доступ к [ePorezi](/gov/taxes/eporezi/), электронным сообщениям и, если на ваш бизнес распространяется соответствующая обязанность, к [eFaktura/SEF](/arrival/business/efaktura/).'
          )
          assert business.count('/arrival/business/efaktura/') == 2
          business_path.write_text(business)

          index_path = pathlib.Path('src/content/docs/CONTENT_INDEX.yml')
          index = main_text(str(index_path))
          needle = '''  - url: /arrival/business/close/
              title: Закрытие предпринимателя
              tags: [бизнес, предприниматель, закрытие, APR, налоги, долги]
              aliases: [закрыть ИП, закрытие предузетника, brisanje preduzetnika, удалить предпринимателя]
              link_when:
                - нужно закрыть предпринимателя в Сербии
                - нужны налоговые справки для удаления из APR
                - нужно понять последствия закрытия для долгов или РВП
              anchors: []
          '''
          addition = needle + '''
            - url: /arrival/business/efaktura/
              title: eFaktura и SEF
              tags: [бизнес, eFaktura, SEF, электронные фактуры, счета, PIB]
              aliases: [е-фактура, электронная фактура, Sistem elektronskih faktura, SEF Сербия]
              link_when:
                - нужно понять обязан ли бизнес работать через SEF
                - клиент или госорган просит электронную фактуру
                - нужно проверить пользователя SEF или настроить доступ
              anchors: []

            - url: /drive/parking/
              title: Парковка в Сербии
              tags: [парковка, Белград, Нови-Сад, зона, PPK, Parking servis]
              aliases: [парковочные зоны, льготная парковка, povlašćena parking karta, станарская парковочная карта]
              link_when:
                - нужно оплатить уличную парковку
                - нужно оформить льготную карту жителя
                - нужно проверить парковочную зону или eDPK
              anchors: []
          '''
          assert needle in index
          index = index.replace(needle, addition, 1)
          assert index.count('/arrival/business/efaktura/') == 1
          assert index.count('/drive/parking/') == 1
          index_path.write_text(index)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/CONTENT_INDEX.yml src/content/docs/arrival/business/index.mdx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair Spy audit index patch"
          git push
