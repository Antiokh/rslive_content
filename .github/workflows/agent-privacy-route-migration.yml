name: One-shot privacy route migration

on:
  push:
    branches:
      - agent/pwa-offline-guide
    paths:
      - .github/workflows/agent-privacy-route-migration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run privacy migration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pwa-offline-guide
          fetch-depth: 0

      - name: Patch route index and monthly roll-up
        shell: python
        run: |
          from pathlib import Path
          import re

          monthly_path = Path('docs/updates/monthly/2026-08.md')
          monthly = monthly_path.read_text(encoding='utf-8')
          marker = '\n## 2026-08-24\n'
          if marker not in monthly:
              raise SystemExit('2026-08-24 monthly block not found')
          monthly = monthly.split(marker, 1)[0] + marker + '''

[Подневный сборник](../daily/2026-08-24.md)

- [Приложение и офлайн-режим](/about/app/) — Добавили понятное описание установки приложения, полной офлайн-копии, экономных обновлений только изменившихся файлов, автообновления и удаления офлайн-данных
- [Политика конфиденциальности](/about/privacy/) — Перенесли сведения о cookies, локальном хранении, офлайн-данных, аналитике, сроках хранения и удалении данных в единую страницу раздела «О проекте»; старый `/cookie/**` сохраняется только через редиректы
- [Privacy Policy](/en/about/privacy/) — Добавили полную английскую страницу о cookies, локальном хранении, офлайн-данных, аналитике, сроках хранения и правах пользователя
- [Политика приватности](/sr/about/privacy/) — Додата је пуна српска страница о cookies, локалном складиштењу, офлајн подацима, аналитици, роковима чувања и правима корисника
'''
          monthly_path.write_text(monthly, encoding='utf-8')

          index_path = Path('src/content/docs/CONTENT_INDEX.yml')
          index = index_path.read_text(encoding='utf-8')

          def remove_route(text, url):
              pattern = rf'(?ms)^  - url: {re.escape(url)}\n.*?^    anchors: \[\]\n'
              next_text, count = re.subn(pattern, '', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one index block for {url}, got {count}')
              return next_text

          for old_url in (
              '/cookie/banner/',
              '/cookie/delete/',
              '/cookie/',
              '/cookie/policy/',
              '/en/cookie/',
              '/en/cookie/policy/',
          ):
              index = remove_route(index, old_url)

          ru_block = '''  - url: /about/privacy/
    title: "Политика конфиденциальности"
    tags: ["RSLive", "о проекте", "конфиденциальность", "cookies", "локальное хранение", "офлайн"]
    aliases: ["политика конфиденциальности RSLive", "cookies RSLive", "хранение данных RSLive"]
    link_when:
      - "нужно понять, какие данные RSLive обрабатывает и хранит в браузере"
      - "нужна информация о cookies, аналитике, локальном хранении или удалении данных"
    anchors: []
'''
          en_block = '''  - url: /en/about/privacy/
    locale: en
    title: "Privacy Policy"
    tags: ["английский", "RSLive", "privacy", "cookies", "local storage", "offline"]
    aliases: ["RSLive Privacy Policy", "RSLive cookies", "RSLive local storage"]
    link_when:
      - "англоязычному читателю нужна политика конфиденциальности RSLive"
      - "нужна информация о cookies, local storage, analytics или offline data на английском"
    anchors: []
'''
          sr_block = '''  - url: /sr/about/privacy/
    locale: sr
    title: "Политика приватности"
    tags: ["сербский", "RSLive", "приватност", "cookies", "локално складиштење", "офлајн"]
    aliases: ["RSLive политика приватности", "RSLive cookies", "локално складиштење RSLive"]
    link_when:
      - "сербскому читателю нужна политика приватности RSLive"
      - "нужна информация о cookies, локалном складиштењу, аналитици или офлајн подацима на сербском"
    anchors: []
'''

          def insert_after_route(text, url, block):
              if block.splitlines()[0] in text:
                  return text
              pattern = rf'(?ms)(^  - url: {re.escape(url)}\n.*?^    anchors: \[\]\n)'
              next_text, count = re.subn(pattern, lambda m: m.group(1) + block, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected anchor route {url} exactly once, got {count}')
              return next_text

          index = insert_after_route(index, '/about/app/', ru_block)
          index = insert_after_route(index, '/en/about/', en_block)
          index = insert_after_route(index, '/sr/about/', sr_block)
          index_path.write_text(index, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/agent-privacy-route-migration.yml
          git config user.name 'Anton Nazarov'
          git config user.email 'antiokh@yandex.ru'
          git add src/content/docs/CONTENT_INDEX.yml docs/updates/monthly/2026-08.md .github/workflows/agent-privacy-route-migration.yml
          git commit -m 'Finish privacy route migration'
          git push origin HEAD:agent/pwa-offline-guide

# One-shot trigger refresh.
