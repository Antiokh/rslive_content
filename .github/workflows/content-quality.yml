name: Контент

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/content/docs/**"
      - "docs/updates/**"
      - "tools/content-quality/**"
      - ".github/workflows/content-quality.yml"
  push:
    branches:
      - main
    paths:
      - "src/content/docs/**"
      - "docs/updates/**"
      - "tools/content-quality/**"
      - ".github/workflows/content-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Проверка качества
    runs-on: ubuntu-latest
    env:
      QC_BASE_SHA: ${{ github.event.before }}
      QC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Получение доверенного кода проверки
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Получение проверяемого контента
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Определение исходной точки изменений PR
        if: github.event_name == 'pull_request'
        working-directory: candidate
        env:
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          current_base_sha="$(git -C ../trusted rev-parse HEAD)"
          git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "${current_base_sha}"
          merge_base_sha="$(git merge-base "${QC_HEAD_SHA}" "${current_base_sha}")"
          echo "QC_BASE_SHA=${merge_base_sha}" >> "${GITHUB_ENV}"

      - name: Подготовка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Установка парсера контента
        run: npm install --prefix trusted/tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Построение временного индекса
        run: |
          set -euo pipefail
          if [ -f trusted/tools/content-quality/generate-content-index.mjs ]; then
            node trusted/tools/content-quality/generate-content-index.mjs --root candidate
          else
            echo "Bootstrap migration: проверяем новый генератор против старого ручного индекса."
            npm install --prefix candidate/tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund
            audit_status=0
            node candidate/tools/content-quality/generate-content-index.mjs --root candidate --audit-legacy || audit_status=$?
            if [ "$audit_status" -ne 0 ]; then
              node candidate/tools/content-quality/migrate-content-index-linking.mjs \
                --root candidate \
                --manifest content-index-migration.json
              node candidate/tools/content-quality/generate-content-index.mjs --root candidate --audit-legacy
              echo "CONTENT_INDEX_MIGRATION_REQUIRED=true" >> "$GITHUB_ENV"
            fi
            node candidate/tools/content-quality/generate-content-index.mjs --root candidate
          fi

      - name: Сохранение миграции семантики
        if: env.CONTENT_INDEX_MIGRATION_REQUIRED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: content-index-linking-migration
          path: content-index-migration.json
          if-no-files-found: error
          retention-days: 1

      - name: Миграцию нужно закоммитить
        if: env.CONTENT_INDEX_MIGRATION_REQUIRED == 'true'
        run: |
          echo "Legacy semantic metadata migrated in the runner; commit the uploaded artifact before this check can pass."
          exit 1

      - name: Контент проверен
        working-directory: candidate
        run: node ../trusted/tools/content-quality/lint-content.mjs
