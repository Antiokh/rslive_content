name: Temporary Edge snapshot E2E validator

on:
  push:
    branches:
      - agent/map-snapshot-edge-e2e-20261105

permissions:
  contents: read

jobs:
  validate-edge-triplet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all map-data and sidecars
        run: node scripts/check-map-data.mjs
