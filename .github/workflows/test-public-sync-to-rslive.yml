name: Stop obsolete public sync test

on:
  push:
    branches:
      - agent/content-sync-public-test

permissions:
  contents: read

concurrency:
  group: test-public-sync-to-private-rslive
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Finish obsolete test cleanly
        run: echo "The end-to-end migration test completed successfully in the second isolated run."
