name: Patch tax residency content index

on:
  push:
    branches:
      - agent/tax-residency-certificate

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tax-residency-certificate

      - name: Update content index and remove one-off workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/content/docs/CONTENT_INDEX.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('# Last updated: 2026-08-05', '# Last updated: 2026-08-06', 1)

          route = '  - url: /gov/taxes/residency/'
          if route not in text:
              marker = '''  - url: /gov/taxes/borovak/
'''
              block = '''  - url: /gov/taxes/residency/
    title: Подтверждение налогового резидентства Сербии
    tags: [налоговое резидентство, ПОР-1, POR-1, Poreska uprava, двойное налогообложение]
    aliases: [сертификат налогового резидентства Сербии, подтверждение резидентства Сербии, potvrda o rezidentnosti]
    link_when:
      - иностранный плательщик просит сертификат налогового резидентства Сербии
      - нужно применить соглашение об избежании двойного налогообложения
      - нужно получить ПОР-1 через Пореску управу
    anchors: []

'''
              if marker not in text:
                  raise SystemExit('Insertion marker not found')
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/agent-patch-tax-residency-index.yml').unlink()
          PY

          git config user.name "Anton Antiokh"
          git config user.email "antiokh@users.noreply.github.com"
          git add src/content/docs/CONTENT_INDEX.yml .github/workflows/agent-patch-tax-residency-index.yml
          git commit -m "Index tax residency certificate guide"
          git push origin HEAD:agent/tax-residency-certificate
