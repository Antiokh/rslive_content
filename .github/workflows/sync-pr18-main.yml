name: Sync PR 18 with main

on:
  push:
    branches:
      - agent/add-practical-life-guides
    paths:
      - .github/workflows/sync-pr18-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-practical-life-guides
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Remove one-shot workflow and push
        run: |
          git rm .github/workflows/sync-pr18-main.yml
          git commit -m "chore: remove one-shot PR 18 sync workflow"
          git push origin HEAD:agent/add-practical-life-guides
