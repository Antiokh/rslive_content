name: Bootstrap Google My Maps LKG

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/google-mymaps-lkg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-mymaps-lkg
          fetch-depth: 0

      - name: Prepare direct-KML helper for active geometry sources
        run: |
          python - <<'PY'
          path = 'scripts/bootstrap-google-lkg.mjs'
          text = open(path, encoding='utf-8').read()
          for line in [
              "  { mid: '19YcKmasJpwHsfB9kvpoSmRA_qD22yhw', bounds: SERBIA_BOUNDS },\n",
              "  { mid: '1qkp5VjmSJBjdaRRnxEtv0gZEaL2Dpk4', bounds: SERBIA_BOUNDS },\n",
              "  { mid: '1kjRg87uMqwqNh0re4t7vw9XE79DLx7w', bounds: BELGRADE_NOVI_SAD_BOUNDS },\n",
          ]:
              text = text.replace(line, '')
          text = text.replace("'user-agent': 'RSLive LKG bootstrap/1.0 (+https://rslive.ru)'", "'user-agent': 'Mozilla/5.0 RSLive LKG bootstrap'")
          open(path, 'w', encoding='utf-8').write(text)
          PY

      - name: Fetch direct-KML snapshots
        run: node scripts/bootstrap-google-lkg.mjs

      - name: Fetch translator KML and viewer coordinates
        run: node scripts/bootstrap-prevodioci-viewer.mjs

      - name: Fetch history-map KML and viewer coordinates
        run: node scripts/bootstrap-history-viewer.mjs

      - name: Validate map data
        run: node scripts/check-map-data.mjs

      - name: Commit snapshots to PR branch
        run: |
          git restore scripts/bootstrap-google-lkg.mjs
          git add map-data/snapshots/google-mymaps/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git commit -m "Add committed Google My Maps LKG snapshots"
          git push origin HEAD:agent/google-mymaps-lkg
