name: Finalize Google My Maps LKG guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/google-mymaps-lkg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-mymaps-lkg
          fetch-depth: 0

      - name: Require every active Google My Maps LKG
        run: |
          python - <<'PY'
          path = 'scripts/check-map-data.mjs'
          text = open(path, encoding='utf-8').read()
          old = "const pilotMid = '1mxkFBhCULwjecdQUWUIfE1BAQahFG6I';"
          new = """const requiredGoogleMids = Object.freeze([\n  '1mxkFBhCULwjecdQUWUIfE1BAQahFG6I',\n  '12l4BVYg_FV0d9CMeEWEtnJDQioL9804',\n  '1qkPRUNRiCqA-uFugbcuVy9INXgw',\n  '1GobqFwJp0QiRJcMYpBKIusIVxUI43kE',\n  '1qkp5VjmSJBjdaRRnxEtv0gZEaL2Dpk4',\n  '1kjRg87uMqwqNh0re4t7vw9XE79DLx7w',\n]);"""
          if old not in text:
              raise SystemExit('pilotMid declaration not found')
          text = text.replace(old, new, 1)
          old_result = "  googlePilot: await checkGoogleSet(pilotMid),"
          new_result = """  google: Object.fromEntries(\n    await Promise.all(requiredGoogleMids.map(async (mid) => [mid, await checkGoogleSet(mid)])),\n  ),"""
          if old_result not in text:
              raise SystemExit('googlePilot result line not found')
          text = text.replace(old_result, new_result, 1)
          open(path, 'w', encoding='utf-8').write(text)
          PY

      - name: Validate all map data
        run: node scripts/check-map-data.mjs

      - name: Commit permanent guard to PR branch
        run: |
          git add scripts/check-map-data.mjs
          if git diff --cached --quiet; then
            echo "No guard changes"
            exit 0
          fi
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git commit -m "Require LKG for active Google My Maps"
          git push origin HEAD:agent/google-mymaps-lkg
