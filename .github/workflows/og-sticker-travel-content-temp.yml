name: Temporary travel OG review refinement

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  refine-travel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1

      - name: Refine travel sticker choices by article content
        shell: python
        run: |
          from pathlib import Path
          import re

          report = Path('docs/OG_STICKER_REVIEW.md')
          text = report.read_text(encoding='utf-8')

          choices = {
              '/lifestyle/travel/': (
                  'bus',
                  'Корень раздела объединяет города, природные территории, исторические объекты и региональные маршруты; `bus` используем как нейтральный образ поездки без привязки к одному типу отдыха.'
              ),
              '/lifestyle/travel/banje/': (
                  'bus',
                  'Статья сравнивает курорты по всей Сербии и строится вокруг выбора направления и логистики; это общий региональный выезд, поэтому используем нейтральный `bus`.'
              ),
              '/lifestyle/travel/events-calendar/': (
                  'calendar',
                  'Главный предмет страницы — даты и актуальный статус событий; `calendar` остаётся прямым тематическим выбором.'
              ),
              '/lifestyle/travel/fortresses/': (
                  'bus',
                  'Крепости разбросаны по всей Сербии, а статья прямо советует собирать их в региональные поездки; `bus` лучше передаёт нейтральный маршрут между городами и объектами.'
              ),
              '/lifestyle/travel/fruska-gora-sremski-karlovci/': (
                  'travelling',
                  'Маршрут смешивает город, Стражилово, тропы и винодельни, но географически это поездка по Воеводине; для таких региональных материалов закрепляем `travelling`.'
              ),
              '/lifestyle/travel/ovcar-kablar-cacak/': (
                  'hiking',
                  'Основная практическая часть статьи — выбор официальной горной тропы, набор высоты, GPX и безопасность на маршруте; `hiking` точнее общего транспортного стикера.'
              ),
              '/lifestyle/travel/resava/': (
                  'bus',
                  'Основной однодневный сценарий — автомобильная связка Манасия → пещера → Лисине; Беляница вынесена в отдельный второй день. Поэтому страница в целом остаётся нейтральной региональной поездкой — `bus`.'
              ),
              '/lifestyle/travel/rtanj/': (
                  'hiking',
                  'Страница целиком посвящена подъёму на Шиляк: маршруты PSS, набор высоты, вода, GPX и подготовка. Здесь `hiking` однозначно соответствует содержанию.'
              ),
              '/lifestyle/travel/short-nature-trips/': (
                  'bus',
                  'Подборка намеренно смешивает озёра, короткую тропу, музей и железнодорожную поездку в разных регионах; `bus` служит нейтральным общим знаком выезда.'
              ),
              '/lifestyle/travel/south-banate/': (
                  'travelling',
                  'Вршац, Бела-Црква и Делиблатская песчара образуют региональный маршрут по Воеводине; для Воеводины используем `travelling`, даже когда внутри есть прогулочные участки.'
              ),
              '/lifestyle/travel/stari-ras-novi-pazar/': (
                  'bus',
                  'Это многодневный региональный маршрут между Нови-Пазаром, памятниками ЮНЕСКО и Пештером; ключевой сценарий — перемещение между разнесёнными точками, поэтому нейтральный `bus`.'
              ),
              '/lifestyle/travel/vojvodina-cities/': (
                  'travelling',
                  'Страница специально посвящена однодневным поездкам по городам Воеводины; для этой географии закрепляем `travelling`.'
              ),
              '/lifestyle/travel/wine-regions/': (
                  'bus',
                  'Материал охватывает несколько винных регионов по всей стране и прямо строится вокруг региона и безопасной транспортной логистики; используем нейтральный `bus`.'
              ),
              '/lifestyle/travel/winter-serbia/': (
                  'cold-weather',
                  'Смысл статьи — зимние условия, снег, работа трасс и подъёмников; `cold-weather` точнее нейтрального транспорта и остаётся специальным сезонным исключением.'
              ),
              '/lifestyle/travel/yugoslav-spomenici/': (
                  'mir-trud-maj',
                  'Страница посвящена мемориальной архитектуре социалистической Югославии; `mir-trud-maj` сохраняем как специальный образ югославского исторического контекста.'
              ),
              '/lifestyle/culture/belgrade-neighborhoods/': (
                  'white-coat-snob',
                  'Это не общий туристический гид по Белграду, а четыре архитектурно-урбанистические прогулки; для урбанистики сохраняем `white-coat-snob`, а `sava-selfie` оставляем для страниц, где Белград выступает именно туристическим направлением.'
              ),
          }

          for slug in sorted({slug for slug, _ in choices.values()}):
              webp = Path(f'src/content/docs/about/stickers/assets/webp/{slug}.webp')
              svg = Path(f'src/content/docs/about/stickers/assets/svg/{slug}.svg')
              if not webp.is_file():
                  raise SystemExit(f'missing webp: {webp}')
              if not svg.is_file():
                  raise SystemExit(f'missing svg: {svg}')

          note = '- Для travel-раздела используем содержательную палитру: `bus` — нейтральная поездка, `hiking` — пешие/горные маршруты, `travelling` — Воеводина, `sava-selfie` — Белград как туристическое направление, `white-coat-snob` — урбанистика, `mir-trud-maj` — югославское наследие.'
          if note not in text:
              anchor = '- `blogerka` по канонической семантике — сатирический образ Instagram-блогеров/монетизации аудитории; это не нейтральный маркер раздела «Блог».'
              if anchor not in text:
                  raise SystemExit('header anchor not found')
              text = text.replace(anchor, anchor + '\n' + note, 1)

          change_heading = '## Предложения, отличающиеся от текущего OG'
          inventory_heading = '## Полный инвентарь'
          comment_heading = '## Как комментировать'
          if change_heading not in text or inventory_heading not in text or comment_heading not in text:
              raise SystemExit('expected report sections not found')

          prefix, rest = text.split(change_heading, 1)
          _, rest = rest.split(inventory_heading, 1)
          inventory_body, suffix = rest.split(comment_heading, 1)

          rows = []
          seen = set()
          for line in inventory_body.strip().splitlines():
              if not line.startswith('| ') or line.startswith('| Текущий стикер') or line.startswith('|---'):
                  continue
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3:
                  raise SystemExit(f'cannot parse row: {line[:160]}')
              current, middle, target = parts
              m = re.match(r'`([^`]+)`<br><br>(.*)', middle)
              if not m:
                  raise SystemExit(f'cannot parse route/reason: {middle[:160]}')
              route, reason = m.groups()
              if route in choices:
                  slug, reason = choices[route]
                  target = f'<img src="../src/content/docs/about/stickers/assets/webp/{slug}.webp" alt="{slug}" width="120"><br><code>{slug}</code>'
                  seen.add(route)
              rows.append((current, route, reason, target))

          missing = sorted(set(choices) - seen)
          if missing:
              raise SystemExit('routes missing from inventory: ' + ', '.join(missing))

          changes = [row for row in rows if row[0] != row[3]]
          table_head = [
              '| Текущий стикер | Страница и объяснение | Предлагаемый стикер |',
              '|---|---|---|',
          ]

          def render(items):
              out = table_head.copy()
              for current, route, reason, target in items:
                  out.append(f'| {current} | `{route}`<br><br>{reason} | {target} |')
              return '\n'.join(out)

          new_text = (
              prefix.rstrip() + '\n\n'
              + change_heading + '\n\n'
              + render(changes) + '\n\n'
              + inventory_heading + '\n\n'
              + render(rows) + '\n\n'
              + comment_heading + suffix
          )
          report.write_text(new_text, encoding='utf-8')

      - name: Commit refined travel review
        run: |
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: refine travel OG choices by content"
          git push origin HEAD:agent/og-sticker-review
