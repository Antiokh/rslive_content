name: Finalize CONTENT_INDEX migration

on:
  push:
    branches:
      - agent/generated-content-index
    paths:
      - ".github/workflows/content-index-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/generated-content-index
          fetch-depth: 1

      - name: Apply permanent migration cleanup
        run: python tools/content-quality/finalize-content-index-migration.py

      - name: Commit final state
        run: |
          set -euo pipefail
          git config user.name "rslive-content-index"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: finalize generated CONTENT_INDEX migration"
          git push origin HEAD:agent/generated-content-index
