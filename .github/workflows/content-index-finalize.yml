name: Finalize CONTENT_INDEX migration

on:
  push:
    branches:
      - agent/generated-content-index
    paths:
      - ".github/workflows/content-index-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/generated-content-index
          fetch-depth: 1

      - name: Finalize permanent index contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replace_required(
              'AGENTS.md',
              '3. `src/content/docs/CONTENT_INDEX.yml` — проверенные маршруты и контекст перелинковки.',
              '3. `docs/CONTENT_INDEX.md` — контракт автоматического индекса; `src/content/docs/CONTENT_INDEX.yml` — его generated-проекция для семантической навигации.',
          )
          replace_required(
              'AGENTS.md',
              '- Проверяйте существование маршрута по дереву `src/content/docs` и `CONTENT_INDEX.yml`.',
              '- Проверяйте существование маршрута прежде всего по дереву `src/content/docs`; `CONTENT_INDEX.yml` используйте как generated-проекцию для семантической навигации.',
          )
          replace_required(
              'AGENTS.md',
              '- При создании, удалении, переносе или существенном переименовании страницы обновляйте `src/content/docs/CONTENT_INDEX.yml`.',
              '- Не редактируйте `src/content/docs/CONTENT_INDEX.yml` вручную. При создании, удалении, переносе или существенном переименовании страницы меняйте дерево и frontmatter; дополнительную семантику задавайте через `linking` по `docs/CONTENT_INDEX.md`.',
          )

          replace_required(
              'README.md',
              '2. Откройте [`src/content/docs/CONTENT_INDEX.yml`](src/content/docs/CONTENT_INDEX.yml).',
              '2. Откройте [`docs/CONTENT_INDEX.md`](docs/CONTENT_INDEX.md) и при необходимости generated-проекцию [`src/content/docs/CONTENT_INDEX.yml`](src/content/docs/CONTENT_INDEX.yml).',
          )
          replace_required(
              'README.md',
              '6. Обновите `CONTENT_INDEX.yml`, если изменились страницы, маршруты или контекст перелинковки.',
              '6. Не редактируйте `CONTENT_INDEX.yml` вручную: маршруты выводятся из дерева, а дополнительный контекст перелинковки задаётся через `frontmatter.linking`.',
          )
          replace_required(
              'README.md',
              '  CONTENT_INDEX.yml          # семантический индекс и карта перелинковки',
              '  CONTENT_INDEX.yml          # автоматически сгенерированный семантический индекс',
          )
          replace_required(
              'README.md',
              '1. Найдите страницу через файловую структуру и `CONTENT_INDEX.yml`.',
              '1. Найдите страницу через файловую структуру; generated `CONTENT_INDEX.yml` используйте как вспомогательную семантическую карту.',
          )
          replace_required(
              'README.md',
              '7. Если меняется смысл страницы, обновите `description`, ключевые слова и индекс.',
              '7. Если меняется смысл страницы, обновите `description`, `keywords` и при необходимости `linking`; индекс перегенерируется автоматически.',
          )

          replace_required(
              'CONTRIBUTING.md',
              'Прочитайте `AGENTS.md`, `PROJECT_CONTEXT.md`, `README.md`, `src/content/docs/CONTENT_INDEX.yml`, `docs/EDITORIAL_POLICY.md`, `docs/MDX_COMPONENTS.md` и `docs/updates/README.md`.',
              'Прочитайте `AGENTS.md`, `PROJECT_CONTEXT.md`, `README.md`, `docs/CONTENT_INDEX.md`, generated `src/content/docs/CONTENT_INDEX.yml`, `docs/EDITORIAL_POLICY.md`, `docs/MDX_COMPONENTS.md` и `docs/updates/README.md`.',
          )
          replace_required(
              'CONTRIBUTING.md',
              'При создании, удалении, переносе или переименовании страницы обновите `CONTENT_INDEX.yml`. Для переноса дополнительно проверьте `astro/public/_redirects` в `Antiokh/rslive.ru`.',
              'При создании, удалении, переносе или переименовании страницы не редактируйте `CONTENT_INDEX.yml` вручную: измените дерево и frontmatter, а для дополнительной семантики используйте `linking`. Для переноса дополнительно проверьте `astro/public/_redirects` в `Antiokh/rslive.ru`.',
          )

          replace_required(
              'PROJECT_CONTEXT.md',
              '- `src/content/docs/CONTENT_INDEX.yml`;',
              '- generated `src/content/docs/CONTENT_INDEX.yml` и контракт его генерации в `docs/CONTENT_INDEX.md`;',
          )
          replace_required(
              'PROJECT_CONTEXT.md',
              'Не делайте вывод о существовании страницы по одному `CONTENT_INDEX.yml`: сверяйте индекс с фактическим деревом файлов. Индекс предназначен для семантической навигации и перелинковки, но не заменяет дерево репозитория.',
              '`CONTENT_INDEX.yml` генерируется из фактического дерева файлов и frontmatter. Не редактируйте его вручную и не используйте как первичный источник существования страницы: маршруты проверяйте по дереву, а generated-индекс используйте для семантической навигации и перелинковки.',
          )
          replace_required(
              'PROJECT_CONTEXT.md',
              '- `src/content/docs/CONTENT_INDEX.yml`;\n- `docs/EDITORIAL_POLICY.md`;',
              '- `docs/CONTENT_INDEX.md` и generated `src/content/docs/CONTENT_INDEX.yml`;\n- `docs/EDITORIAL_POLICY.md`;',
          )

          workflow = Path('.github/workflows/content-quality.yml')
          text = workflow.read_text()
          old = '''            audit_status=0
            node candidate/tools/content-quality/generate-content-index.mjs --root candidate --audit-legacy || audit_status=$?
            if [ "$audit_status" -ne 0 ]; then
              node candidate/tools/content-quality/migrate-content-index-linking.mjs \\
                --root candidate \\
                --manifest content-index-migration.json
              node candidate/tools/content-quality/generate-content-index.mjs --root candidate --audit-legacy
              echo "CONTENT_INDEX_MIGRATION_REQUIRED=true" >> "$GITHUB_ENV"
            fi
            node candidate/tools/content-quality/generate-content-index.mjs --root candidate
'''
          new = '''            node candidate/tools/content-quality/generate-content-index.mjs --root candidate --audit-legacy
            node candidate/tools/content-quality/generate-content-index.mjs --root candidate
'''
          if old not in text:
              raise SystemExit('Bootstrap migration block not found in content-quality.yml')
          text = text.replace(old, new)
          artifact_block = '''
      - name: Сохранение миграции семантики
        if: env.CONTENT_INDEX_MIGRATION_REQUIRED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: content-index-linking-migration
          path: content-index-migration.json
          if-no-files-found: error
          retention-days: 1

      - name: Миграцию нужно закоммитить
        if: env.CONTENT_INDEX_MIGRATION_REQUIRED == 'true'
        run: |
          echo "Legacy semantic metadata migrated in the runner; commit the uploaded artifact before this check can pass."
          exit 1
'''
          if artifact_block not in text:
              raise SystemExit('Temporary artifact block not found in content-quality.yml')
          workflow.write_text(text.replace(artifact_block, ''))

          for path in [
              '.github/workflows/content-index-bootstrap-migration.yml',
              '.github/workflows/content-index-finalize.yml',
              'tools/content-quality/migrate-content-index-linking.mjs',
          ]:
              file = Path(path)
              if file.exists():
                  file.unlink()
          PY

          git config user.name "rslive-content-index"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: finalize generated CONTENT_INDEX migration"
          git push origin HEAD:agent/generated-content-index
