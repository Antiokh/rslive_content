name: Humanizer RU review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  humanizer:
    name: Humanizer RU advisory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted review tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout proposed content
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
          persist-credentials: false

      - name: Collect changed MDX files
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const mdx = files
              .filter(file =>
                file.status !== 'removed' &&
                file.filename.startsWith('src/content/docs/') &&
                file.filename.endsWith('.mdx')
              )
              .map(file => file.filename);
            fs.writeFileSync('/tmp/humanizer-files.txt', mdx.join('\n'));

      - name: Fetch current humanizer--ru skill
        run: |
          git clone --depth=1 --branch main https://github.com/Antiokh/humanizer--ru.git /tmp/humanizer--ru
          python3 /tmp/humanizer--ru/scripts/lint.py --self-test

      - name: Build Humanizer review
        run: |
          python3 base/.github/scripts/humanizer_pr_review.py \
            --humanizer /tmp/humanizer--ru/scripts/lint.py \
            --base-root base \
            --head-root head \
            --files /tmp/humanizer-files.txt \
            --output /tmp/humanizer-comment.md

      - name: Create or update PR comment
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: /tmp/humanizer-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- humanizer-ru-review -->';
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
