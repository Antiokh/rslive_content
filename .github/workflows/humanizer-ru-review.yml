name: Humanizer RU review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

env:
  HUMANIZER_SHA: 9f5d63b8ccf12741932e393dddd32c2e9491aa49

jobs:
  humanizer:
    name: Humanizer RU advisory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted review tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout proposed content
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
          persist-credentials: false

      - name: Collect changed MDX files
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const mdx = files
              .filter(file =>
                file.status !== 'removed' &&
                file.filename.startsWith('src/content/docs/') &&
                file.filename.endsWith('.mdx')
              )
              .map(file => file.filename);
            fs.writeFileSync('/tmp/humanizer-files.txt', mdx.join('\n'));

      - name: Fetch pinned humanizer--ru skill
        run: |
          git init /tmp/humanizer--ru
          git -C /tmp/humanizer--ru remote add origin https://github.com/Antiokh/humanizer--ru.git
          git -C /tmp/humanizer--ru fetch --depth=1 origin "$HUMANIZER_SHA"
          git -C /tmp/humanizer--ru checkout --detach FETCH_HEAD
          test "$(git -C /tmp/humanizer--ru rev-parse HEAD)" = "$HUMANIZER_SHA"
          python3 /tmp/humanizer--ru/scripts/lint.py --self-test

      - name: Build Humanizer review
        run: |
          python3 base/.github/scripts/humanizer_pr_review.py \
            --humanizer /tmp/humanizer--ru/scripts/lint.py \
            --base-root base \
            --head-root head \
            --files /tmp/humanizer-files.txt \
            --output /tmp/humanizer-comment.md

      - name: Add review to job summary
        run: cat /tmp/humanizer-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMMENT_PATH: /tmp/humanizer-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- humanizer-ru-review -->';
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
