name: Temporary OG review social override

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  update-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1

      - name: Update social sticker decision
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('docs/OG_STICKER_REVIEW.md')
          text = path.read_text(encoding='utf-8')
          route = '/integration/social/'
          new_reason = 'По решению ревью для страницы социальной поддержки используем `heisenberg` — обычного Хайзенберга в шляпе/очках с бородкой; `breaking-bad-crystals` здесь не используется.'
          new_target = '<img src="../src/content/docs/about/stickers/assets/webp/heisenberg.webp" alt="heisenberg" width="120"><br><code>heisenberg</code>'

          lines = []
          changed = 0
          for line in text.splitlines():
              if f'`{route}`' in line and line.startswith('| '):
                  body = line[2:-2] if line.endswith(' |') else line[2:]
                  parts = body.split(' | ', 2)
                  if len(parts) != 3:
                      raise SystemExit('cannot parse social row')
                  current, middle, _target = parts
                  middle = f'`{route}`<br><br>{new_reason}'
                  line = f'| {current} | {middle} | {new_target} |'
                  changed += 1
              lines.append(line)

          if changed != 2:
              raise SystemExit(f'expected 2 social rows, changed {changed}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Commit review update and remove temporary workflow
        run: |
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git rm .github/workflows/og-sticker-review-social-temp.yml
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: set social OG review to heisenberg"
          git push origin HEAD:agent/og-sticker-review
