name: Apply semantic index update

on:
  push:
    branches:
      - agent/add-practical-life-guides
    paths:
      - .github/workflows/apply-content-index.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed index changes
        run: python scripts/apply_content_index.py

      - name: Commit result and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/CONTENT_INDEX.yml
          git rm .github/workflows/apply-content-index.yml scripts/apply_content_index.py
          git commit -m "content: update semantic index"
          git push origin HEAD:agent/add-practical-life-guides
