name: Index semantic audit PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/content/docs/CONTENT_INDEX.yml"
      - "tools/content-quality/index-semantic-audit.cjs"
      - ".github/workflows/index-semantic-audit-pr.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install YAML parser
        run: npm install --prefix tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Prepare base index
        run: |
          git show "${{ github.event.pull_request.base.sha }}:src/content/docs/CONTENT_INDEX.yml" > /tmp/main-index.yml
      - name: Audit all index entries
        env:
          BASE_INDEX: /tmp/main-index.yml
        run: node tools/content-quality/index-semantic-audit.cjs
