name: Temporary CONTENT_INDEX full audit

on:
  push:
    branches:
      - agent/content-index-full-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install audit dependencies
        run: |
          npm install --prefix tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund
          npm install --prefix tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund --no-save github-slugger@2

      - name: Run exhaustive legacy audit
        env:
          LEGACY_REF: 01a48adab04c28e12f7e06648d615af21b3cb3e2
        run: node tools/content-quality/tmp-audit-content-index-legacy.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-index-full-audit
          path: /tmp/content-index-full-audit.json
          if-no-files-found: error
