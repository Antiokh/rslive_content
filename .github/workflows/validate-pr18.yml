name: Validate PR 18 content

on:
  push:
    branches:
      - agent/add-practical-life-guides
    paths:
      - .github/workflows/validate-pr18.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-practical-life-guides
          fetch-depth: 0

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate MDX, links, footnotes and index
        run: python scripts/validate_pr18.py

      - name: Remove one-shot validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/validate_pr18.py .github/workflows/validate-pr18.yml
          git commit -m "chore: remove one-shot PR 18 validator"
          git push origin HEAD:agent/add-practical-life-guides
