name: Temporary repair OG frontmatter formatting

on:
  push:
    branches:
      - agent/apply-og-stickers

permissions:
  contents: write

jobs:
  repair-og:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-og-stickers
          fetch-depth: 0

      - name: Fetch current sources
        run: |
          git fetch origin main agent/og-sticker-review
          test "$(git rev-parse origin/main)" = "bddadba74c63dbb2ff0909f7c33b746bc952dcd4"
          git show origin/agent/og-sticker-review:docs/OG_STICKER_REVIEW.md > /tmp/OG_STICKER_REVIEW.md

      - name: Rebuild affected files from main with only ogSticker changed
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          report = Path('/tmp/OG_STICKER_REVIEW.md').read_text(encoding='utf-8')
          start = '## Предложения, отличающиеся от текущего OG'
          end = '## Полный инвентарь'
          section = report.split(start, 1)[1].split(end, 1)[0]

          decisions = {}
          for line in section.splitlines():
              if not line.startswith('| ') or line.startswith('| Текущий стикер') or line.startswith('|---'):
                  continue
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3:
                  raise SystemExit(f'cannot parse review row: {line[:160]}')
              _current, middle, target = parts
              rm = re.match(r'`([^`]+)`<br><br>', middle)
              sm = re.findall(r'<code>([^<]+)</code>', target)
              if not rm or not sm:
                  raise SystemExit(f'cannot parse route/slug: {line[:160]}')
              decisions[rm.group(1)] = sm[-1].strip()
          decisions['/integration/social/'] = 'heisenberg'

          root = Path('src/content/docs')
          route_to_path = {}
          for path in list(root.rglob('*.mdx')) + list(root.rglob('*.md')):
              rel = path.relative_to(root)
              parts = rel.parent.parts if rel.name in ('index.mdx', 'index.md') else rel.with_suffix('').parts
              route = '/' if not parts else '/' + '/'.join(parts) + '/'
              route_to_path[route] = path

          def from_main(path):
              return subprocess.check_output(
                  ['git', 'show', f'origin/main:{path.as_posix()}'],
                  text=True,
                  encoding='utf-8'
              )

          def replace_og(source, slug):
              lines = source.splitlines(keepends=True)
              if not lines or lines[0].strip() != '---':
                  raise SystemExit('frontmatter start missing')
              close = next((i for i in range(1, len(lines)) if lines[i].strip() == '---'), None)
              if close is None:
                  raise SystemExit('frontmatter close missing')
              og = [i for i in range(1, close) if re.match(r'^ogSticker\s*:', lines[i])]
              if len(og) > 1:
                  raise SystemExit('multiple ogSticker lines')
              if og:
                  i = og[0]
                  ending = '\r\n' if lines[i].endswith('\r\n') else ('\n' if lines[i].endswith('\n') else '')
                  lines[i] = f'ogSticker: {slug}{ending}'
              else:
                  ending = '\r\n' if lines[close].endswith('\r\n') else '\n'
                  lines.insert(close, f'ogSticker: {slug}{ending}')
              return ''.join(lines)

          def without_og(text):
              lines = text.splitlines(keepends=True)
              if not lines or lines[0].strip() != '---':
                  return text
              close = next((i for i in range(1, len(lines)) if lines[i].strip() == '---'), None)
              if close is None:
                  raise SystemExit('frontmatter close missing during verification')
              return ''.join(line for i, line in enumerate(lines) if not (0 < i < close and re.match(r'^ogSticker\s*:', line)))

          missing = sorted(set(decisions) - set(route_to_path))
          if missing:
              raise SystemExit('routes missing: ' + ', '.join(missing))

          expected_changed = set()
          for route, slug in sorted(decisions.items()):
              path = route_to_path[route]
              source = from_main(path)
              rebuilt = replace_og(source, slug)
              if without_og(rebuilt) != without_og(source):
                  raise SystemExit(f'non-og content differs after rebuild: {route}')
              if rebuilt != source:
                  expected_changed.add(path.as_posix())
              path.write_text(rebuilt, encoding='utf-8')

          # Verify every actual article diff is expected and differs from main only by ogSticker.
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main', '--', 'src/content/docs'], text=True).splitlines()
          actual = set(changed)
          if actual != expected_changed:
              extra = sorted(actual - expected_changed)
              absent = sorted(expected_changed - actual)
              raise SystemExit(f'changed set mismatch; extra={extra}; absent={absent}')

          for route, slug in decisions.items():
              path = route_to_path[route]
              main = from_main(path)
              branch = path.read_text(encoding='utf-8')
              if without_og(branch) != without_og(main):
                  raise SystemExit(f'non-og difference remains: {route}')
              lines = branch.splitlines()
              close = next(i for i in range(1, len(lines)) if lines[i].strip() == '---')
              values = [line.split(':', 1)[1].strip() for line in lines[1:close] if re.match(r'^ogSticker\s*:', line)]
              if values != [slug]:
                  raise SystemExit(f'wrong ogSticker for {route}: got {values}, expected {slug}')

          social = route_to_path['/integration/social/'].read_text(encoding='utf-8')
          social_lines = social.splitlines()
          social_close = next(i for i in range(1, len(social_lines)) if social_lines[i].strip() == '---')
          social_front = '\n'.join(social_lines[1:social_close])
          if not re.search(r'(?m)^ogSticker:\s*heisenberg\s*$', social_front):
              raise SystemExit('social is not heisenberg')
          if 'breaking-bad-crystals' in social_front:
              raise SystemExit('social incorrectly references breaking-bad-crystals')

          print(f'validated {len(decisions)} decisions; {len(expected_changed)} produce changes vs main')

      - name: Verify and commit repair
        run: |
          git diff --check origin/main
          git rm .github/workflows/fix-og-frontmatter-temp.yml
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add src/content/docs
          git diff --cached --check
          git commit -m "fix: preserve frontmatter while applying OG stickers"
          git push origin HEAD:agent/apply-og-stickers
