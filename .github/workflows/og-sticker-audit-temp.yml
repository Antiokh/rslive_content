name: Temporary OG sticker audit

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  visualize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1

      - name: Reformat review tables with sticker previews
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/OG_STICKER_REVIEW.md')
          lines = path.read_text(encoding='utf-8').splitlines()

          def split_row(line):
              body = line.strip().strip('|').strip()
              return [part.replace('\\|', '|').strip() for part in body.split(' | ')]

          def sticker_cell(value):
              value = value.strip().strip('`')
              if value.startswith('engine-owned'):
                  return '—<br><sub>engine-owned / без MDX frontmatter</sub>'
              if value.startswith('fallback: giant-book.svg'):
                  slug = 'giant-book'
                  label = 'fallback → giant-book'
              else:
                  slug = value
                  label = value
              image = f'https://raw.githubusercontent.com/Antiokh/rslive_content/main/src/content/docs/about/stickers/assets/{slug}.webp'
              return f'<img src="{image}" alt="{slug}" width="120"><br><code>{label}</code>'

          out = []
          section = None
          header_done = False

          for line in lines:
              if line == '## Предложения, отличающиеся от текущего OG':
                  section = 'changes'
                  header_done = False
                  out.append(line)
                  continue
              if line == '## Полный инвентарь':
                  section = 'inventory'
                  header_done = False
                  out.append(line)
                  continue
              if line.startswith('## ') and line not in {'## Предложения, отличающиеся от текущего OG', '## Полный инвентарь'}:
                  section = None
                  header_done = False
                  out.append(line)
                  continue

              if section and line.startswith('|'):
                  parts = split_row(line)
                  if not header_done:
                      out.append('| Текущий стикер | Страница и объяснение | Предлагаемый стикер |')
                      out.append('|---|---|---|')
                      header_done = True
                      continue
                  if parts == ['---', '---', '---'] or parts == ['---:', '---', '---', '---', '---', '---']:
                      continue
                  if section == 'changes':
                      if len(parts) == 4:
                          route, current, target, reason = parts
                      elif len(parts) == 3 and '<img ' in parts[0]:
                          out.append(line)
                          continue
                      else:
                          continue
                  else:
                      if len(parts) == 6:
                          _, route, _, current, target, reason = parts
                      elif len(parts) == 3 and '<img ' in parts[0]:
                          out.append(line)
                          continue
                      else:
                          continue
                  out.append(f'| {sticker_cell(current)} | {route}<br><br>{reason} | {sticker_cell(target)} |')
                  continue

              out.append(line)

          path.write_text('\n'.join(out) + '\n', encoding='utf-8')

      - name: Commit visual review format
        run: |
          git config user.name "rslive-og-audit"
          git config user.email "actions@github.com"
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: show OG sticker previews in review"
          git push origin HEAD:agent/og-sticker-review
