name: Temporary OG sticker audit

on:
  push:
    branches:
      - agent/og-sticker-review

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/og-sticker-review
          fetch-depth: 1

      - name: Generate OG sticker review
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('src/content/docs')
          index_text = (root / 'CONTENT_INDEX.yml').read_text(encoding='utf-8')
          routes = re.findall(r'^  - url: "([^"]+)"', index_text, flags=re.M)

          by_route = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix not in {'.md', '.mdx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              fm = ''
              if text.startswith('---'):
                  parts = text.split('---', 2)
                  if len(parts) >= 3:
                      fm = parts[1]
              rel = path.relative_to(root).as_posix()
              if rel in {'index.md', 'index.mdx'}:
                  route = '/'
              elif rel in {'404.md', '404.mdx'}:
                  route = '/404/'
              elif rel.endswith('/index.mdx'):
                  route = '/' + rel[:-len('index.mdx')]
              elif rel.endswith('/index.md'):
                  route = '/' + rel[:-len('index.md')]
              else:
                  route = '/' + re.sub(r'\.(md|mdx)$', '/', rel)
              m = re.search(r'^ogSticker:\s*["\']?([^"\'\s#]+)', fm, flags=re.M)
              og = m.group(1) if m else None
              by_route[route] = {'path': rel, 'og': og}

          proposed = {
              '/about/advertising/': 'logo',
              '/about/app/': 'smartphone',
              '/adaptation/birth/clinics/': 'doctor',
              '/adaptation/birth/med/': 'doctor',
              '/arrival/business/codes/': 'letter-list',
              '/arrival/business/doo/': 'businessman',
              '/arrival/business/e-comm/': 'businessman',
              '/arrival/business/efaktura/': 'businessman',
              '/arrival/shops/': 'shopping-lidl',
              '/blog/dobro_pozhalovat_v_instrukciju_po_serbii/': 'logo',
              '/blog/kogda_serbija_budet_v_es/': 'internet-research',
              '/blog/kakaja_srednjaja_zarplata_v_serbii/': 'looking-for-salary',
              '/blog/pochemu_serbija_ljubit_rossiju/': 'internet-research',
              '/blog/pochemu_russkie_edut_v_serbiju/': 'move-stuff',
              '/blog/kak_otnosjatsja_k_lgbt_v_serbii/': 'internet-research',
              '/blog/javljaetsja_li_serbija_bezopasnoj_stranoj/': 'internet-research',
              '/blog/kak_v_serbii_otnosjatsja_k_russkim/': 'internet-research',
              '/blog/gde_dorozhe_v_rossii_ili_v_serbii/': 'payment-card',
              '/blog/pochemu_serbija_byla_pod_sankcijami/': 'internet-research',
              '/blog/kogo_podderzhala_serbija_v_vojne_s_ukrainoj/': 'internet-research',
              '/blog/chto_izmenilos_v_rslive_za_mesjac/': 'logo',
              '/blog/osnovnye_nalogovye_objazatelstva_do_konca_goda_v_serbii/': 'calendar',
              '/blog/serbija_samaja_dinamichno_rastuschaja_ehkonomika_evropy/': 'investments-stock',
              '/blog/javljaetsja_li_serbija_xoroshej_stranoj_dlja_pereezda/': 'move-stuff',
              '/blog/pochemu_serbija_luchshaja_strana_dlja_immigracii_russkix/': 'move-stuff',
              '/children/': 'child',
              '/children/birth/': 'child',
              '/children/school/': 'schoolchild',
              '/en/about/advertising/': 'logo',
              '/en/russians-in-serbia/': 'russian-flag',
              '/lifestyle/coffee-bakeries-desserts/': 'kafa-coffee',
              '/lifestyle/culture/belgrade-neighborhoods/': 'map',
              '/lifestyle/culture/books/': 'book-reader',
              '/lifestyle/culture/events/': 'calendar',
              '/lifestyle/culture/museums/': 'book-reader',
              '/lifestyle/ecology/recycling/': 'volunteer-ecology',
              '/lifestyle/familiar-foods/': 'russian-food',
              '/lifestyle/holidays/': 'calendar',
              '/lifestyle/local-goods/': 'checkout',
              '/lifestyle/serbian-food/': 'pecenje',
              '/lifestyle/travel/events-calendar/': 'calendar',
              '/lifestyle/world-cuisines-belgrade/': 'menu-restorant',
              '/map/cuisine/': 'map',
              '/map/familiar-foods/': 'map',
              '/map/nosmoke/': 'gas-smoke-gray',
              '/med/': 'doctor',
              '/med/blood-donation/': 'doctor',
              '/move/exchange/': 'exchange',
              '/move/housing/electricity/': 'uplatnica',
              '/move/housing/handover/': 'house-keys',
              '/move/housing/utilities/': 'uplatnica',
              '/move/myths/': 'internet-research',
              '/sources/': 'internet-research',
              '/sr/about/advertising/': 'logo',
              '/sr/rusi-u-srbiji/': 'russian-flag',
          }

          explanations = {
              '/about/advertising/': 'Страница о рекламе внутри RSLive; `logo` связывает OG с самим проектом и лучше безликой книги-fallback.',
              '/about/app/': 'Страница посвящена приложению; `smartphone` точнее общего списка.',
              '/adaptation/birth/clinics/': 'Страница про медицинские учреждения; `doctor` точнее идентификационного `id`.',
              '/adaptation/birth/med/': 'Медицинское наблюдение беременности — прямая медицинская тема; `doctor` точнее `id`.',
              '/arrival/business/codes/': 'Это справочник кодов деятельности; `letter-list` соответствует структуре и содержанию лучше fallback.',
              '/arrival/business/doo/': 'Регистрация и ведение компании — бизнес-тема; `businessman` точнее стикера про поиск зарплаты.',
              '/arrival/business/e-comm/': 'Электронная коммерция — бизнес-инфраструктура; `businessman` лучше generic fallback.',
              '/arrival/business/efaktura/': 'SEF/eFaktura — операционная часть бизнеса; `businessman` точнее стикера про зарплату.',
              '/arrival/shops/': 'Страница о магазинах и повседневных покупках; `shopping-lidl` — канонический shopping-сюжет.',
              '/blog/dobro_pozhalovat_v_instrukciju_po_serbii/': 'Материал о самом RSLive; `logo` описывает проект, а `blogerka` — сатиру на блогеров.',
              '/blog/kogda_serbija_budet_v_es/': 'Фактологический разбор переговоров и условий вступления; нейтральный исследовательский OG.',
              '/blog/kakaja_srednjaja_zarplata_v_serbii/': 'Тема страницы — зарплата и доходы; есть прямой тематический стикер.',
              '/blog/pochemu_serbija_ljubit_rossiju/': 'Историко-социальный разбор; исследовательская метафора точнее сатирической «блогерки».',
              '/blog/pochemu_russkie_edut_v_serbiju/': 'Основной сюжет — переезд и миграция.',
              '/blog/kak_otnosjatsja_k_lgbt_v_serbii/': 'Фактологический обзор права и общественных данных; нужен нейтральный исследовательский OG.',
              '/blog/javljaetsja_li_serbija_bezopasnoj_stranoj/': 'Страница сопоставляет данные о безопасности и рисках; исследовательский OG точнее.',
              '/blog/kak_v_serbii_otnosjatsja_k_russkim/': 'Обзор исторических, социальных и политических факторов; исследовательский OG без сатирического оттенка.',
              '/blog/gde_dorozhe_v_rossii_ili_v_serbii/': 'Сравнение расходов и стоимости жизни; финансовый OG соответствует предмету.',
              '/blog/pochemu_serbija_byla_pod_sankcijami/': 'Историко-политический справочный материал; нейтральный исследовательский OG.',
              '/blog/kogo_podderzhala_serbija_v_vojne_s_ukrainoj/': 'Фактологический разбор внешнеполитических решений; нейтральный исследовательский OG.',
              '/blog/chto_izmenilos_v_rslive_za_mesjac/': 'Материал об изменениях самого проекта; `logo` является прямой семантической привязкой.',
              '/blog/osnovnye_nalogovye_objazatelstva_do_konca_goda_v_serbii/': 'Ключевой смысл — календарные налоговые сроки до конца года.',
              '/blog/serbija_samaja_dinamichno_rastuschaja_ehkonomika_evropy/': 'Экономический рост и показатели; инвестиционно-экономическая метафора точнее.',
              '/blog/javljaetsja_li_serbija_xoroshej_stranoj_dlja_pereezda/': 'Материал оценивает практические условия переезда; миграционный OG соответствует теме.',
              '/blog/pochemu_serbija_luchshaja_strana_dlja_immigracii_russkix/': 'Основной предмет — иммиграция и переезд; `move-stuff` соответствует содержанию без блогерской сатиры.',
              '/children/': 'Раздел целиком о детях; `child` прямее общего `giant-book`.',
              '/children/birth/': 'Рождение ребёнка — прямой сюжет `child`; сейчас страница уходит в generic fallback.',
              '/children/school/': 'Школьный раздел; `schoolchild` точнее общего `giant-book`.',
              '/en/about/advertising/': 'Английская версия страницы о рекламе RSLive; `logo` логично связывает её с проектом.',
              '/en/russians-in-serbia/': 'Энциклопедический раздел о русских в Сербии; `russian-flag` точнее `party`, который означает вечеринку.',
              '/lifestyle/coffee-bakeries-desserts/': 'Кофейни, пекарни и десерты; `kafa-coffee` даёт прямой тематический образ вместо fallback.',
              '/lifestyle/culture/belgrade-neighborhoods/': 'Районы Белграда — пространственная/городская тема; `map` точнее fallback.',
              '/lifestyle/culture/books/': 'Книги и чтение; `book-reader` — прямой канонический сюжет.',
              '/lifestyle/culture/events/': 'Культурные события завязаны на даты; `calendar` точнее fallback.',
              '/lifestyle/culture/museums/': 'Музеи — культурно-образовательная тема; `book-reader` ближе generic fallback.',
              '/lifestyle/ecology/recycling/': 'Переработка — экологическая тема; `volunteer-ecology` точнее generic fallback.',
              '/lifestyle/familiar-foods/': 'Страница про привычные русскоязычной аудитории продукты; `russian-food` передаёт предмет лучше fallback.',
              '/lifestyle/holidays/': 'Праздники привязаны к датам; `calendar` — нейтральный и прямой вариант.',
              '/lifestyle/local-goods/': 'Страница о покупке местных товаров; `checkout` обозначает покупки без привязки к конкретной сети.',
              '/lifestyle/serbian-food/': 'Сербская еда; `pecenje` — узнаваемый канонический гастрономический образ.',
              '/lifestyle/travel/events-calendar/': 'Это календарь событий; `calendar` точнее fallback.',
              '/lifestyle/world-cuisines-belgrade/': 'Рестораны и кухни мира; `menu-restorant` передаёт ресторанную тему.',
              '/map/cuisine/': 'Это именно карта гастрономических мест; `map` точнее generic fallback.',
              '/map/familiar-foods/': 'Это картографический раздел с точками; `map` лучше generic fallback.',
              '/map/nosmoke/': '`no-drinking` семантически про алкоголь; канонический `gas-smoke-gray` прямо предназначен для дыма и некурящих мест.',
              '/med/': 'Корневой медицинский раздел; `doctor` точнее идентификационного `id`.',
              '/med/blood-donation/': 'Донорство крови — медицинская тема; `doctor` точнее `id`.',
              '/move/exchange/': '`exchange` прямо обозначает обмен валюты и обменные пункты; точнее общего `payment-card`.',
              '/move/housing/electricity/': 'Электричество в жилье связано с коммунальными начислениями и оплатой; `uplatnica` точнее generic fallback.',
              '/move/housing/handover/': 'Приём-передача жилья и ключей; `house-keys` — прямой сюжет.',
              '/move/housing/utilities/': 'Коммунальные услуги и счета; `uplatnica` точнее generic fallback.',
              '/move/myths/': 'Разбор мифов — проверка утверждений и источников; `internet-research` точнее общей карты.',
              '/sources/': 'Страница источников и проверки информации; `internet-research` — прямой канонический сюжет.',
              '/sr/about/advertising/': 'Сербская версия страницы о рекламе RSLive; `logo` логично связывает её с проектом.',
              '/sr/rusi-u-srbiji/': 'Энциклопедический раздел о русских в Сербии; `russian-flag` точнее `party`, который означает вечеринку.',
          }

          lines = [
              '# Аудит OG-стикеров',
              '',
              '> Review-only: этот файл фиксирует предложения. Frontmatter статей в этом PR не меняется.',
              '',
              f'- Snapshot content: `{subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}`',
              f'- Маршрутов в `CONTENT_INDEX.yml`: **{len(routes)}**',
              '- Если у MD/MDX нет `ogSticker`, движок использует fallback `giant-book.svg`.',
              '- `blogerka` по канонической семантике — сатирический образ Instagram-блогеров/монетизации аудитории; это не нейтральный маркер раздела «Блог».',
              '',
              '## Предложения, отличающиеся от текущего OG',
              '',
              '| Страница | Текущий OG | Предлагается | Объяснение |',
              '|---|---|---|---|',
          ]

          changes = []
          inventory = []
          for route in routes:
              info = by_route.get(route)
              if info:
                  current = info['og'] if info['og'] else 'fallback: giant-book.svg'
                  source = f"`{info['path']}`"
              else:
                  current = 'engine-owned / без MDX frontmatter'
                  source = 'engine-owned'
              target = proposed.get(route, current)
              reason = explanations.get(route, 'Предлагается оставить: отдельного основания для замены по теме страницы и канонической семантике не найдено.')
              row = (route, current, target, reason, source)
              inventory.append(row)
              if target != current:
                  changes.append(row)

          def esc(s):
              return str(s).replace('|', '\\|').replace('\n', ' ')

          for route, current, target, reason, source in changes:
              lines.append(f'| `{esc(route)}` | `{esc(current)}` | `{esc(target)}` | {esc(reason)} |')

          lines += [
              '',
              '## Полный инвентарь',
              '',
              '| # | Страница | Источник | Текущий OG | Предлагается | Объяснение |',
              '|---:|---|---|---|---|---|',
          ]
          for i, (route, current, target, reason, source) in enumerate(inventory, 1):
              lines.append(f'| {i} | `{esc(route)}` | {source} | `{esc(current)}` | `{esc(target)}` | {esc(reason)} |')

          lines += [
              '',
              '## Как комментировать',
              '',
              'Оставляйте комментарий к конкретной строке: какой стикер выбрать вместо предложенного или почему текущий лучше. После согласования изменения `ogSticker` будут сделаны отдельным проходом.',
              '',
              '## Ограничения',
              '',
              '- Инвентарь MD/MDX и текущие значения `ogSticker` собраны автоматически из snapshot выше.',
              '- Engine-owned маршруты без MDX помечены отдельно: этот файл не приписывает им выдуманный frontmatter.',
              '- Семантика предложений сверяется с каноническим `astro/config/sticker-semantics.mjs` в `Antiokh/rslive.ru`.',
          ]

          Path('docs/OG_STICKER_REVIEW.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Commit generated inventory
        run: |
          git config user.name "rslive-og-audit"
          git config user.email "actions@github.com"
          git add docs/OG_STICKER_REVIEW.md
          git commit -m "docs: update OG sticker review inventory"
          git push origin HEAD:agent/og-sticker-review
