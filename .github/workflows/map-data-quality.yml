name: Проверка картографических данных

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "map-data/**"
      - "scripts/check-map-data.mjs"
      - "scripts/yandex-lkg-utils.mjs"
      - "scripts/refresh-yandex-lkg.mjs"
      - "scripts/check-yandex-lkg-utils.mjs"
      - ".github/workflows/map-data-quality.yml"
      - ".github/workflows/refresh-yandex-map-lkg.yml"
  push:
    branches:
      - main
    paths:
      - "map-data/**"
      - "scripts/check-map-data.mjs"
      - "scripts/yandex-lkg-utils.mjs"
      - "scripts/refresh-yandex-lkg.mjs"
      - "scripts/check-yandex-lkg-utils.mjs"
      - ".github/workflows/map-data-quality.yml"
      - ".github/workflows/refresh-yandex-map-lkg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Проверка картографических данных
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить картографические данные
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Проверить синтаксис обновления снимков
        run: node --check scripts/refresh-yandex-lkg.mjs

      - name: Проверить хеширование снимков Яндекса
        run: node scripts/check-yandex-lkg-utils.mjs

      - name: Проверить сохранённые картографические данные
        run: node scripts/check-map-data.mjs
