name: humanizer_russian input contract

on:
  pull_request:
    paths:
      - '.github/scripts/humanizer_pr_review.py'
      - '.github/workflows/humanizer-russian-review.yml'
      - '.github/workflows/humanizer-input-contract.yml'
      - 'docs/HUMANIZER_REVIEW.md'

permissions:
  contents: read

env:
  HUMANIZER_SHA: ad90c24b8a5705f455fc387b2cd5b77a17959257

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned humanizer_russian
        run: |
          git init /tmp/humanizer_russian
          git -C /tmp/humanizer_russian remote add origin https://github.com/Antiokh/humanizer_russian.git
          git -C /tmp/humanizer_russian fetch --depth=1 origin "$HUMANIZER_SHA"
          git -C /tmp/humanizer_russian checkout --detach FETCH_HEAD
          test "$(git -C /tmp/humanizer_russian rev-parse HEAD)" = "$HUMANIZER_SHA"

      - name: Compile adapter
        run: python3 -m py_compile .github/scripts/humanizer_pr_review.py

      - name: Verify full-article input contract
        run: |
          python3 .github/scripts/humanizer_pr_review.py \
            --humanizer-root /tmp/humanizer_russian \
            --self-test | tee /tmp/humanizer-input-contract.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/humanizer-input-contract.json', encoding='utf-8'))
          assert data['mode'] == 'editorial_board'
          assert data['scope'] == 'whole_article'
          assert data['frontmatter_excluded'] is True
          assert data['title_test_rule'] == 'ILY-M01'
          assert data['description_test_rule'] == 'ILY-M01'
          assert data['metadata_false_positive'] is False
          assert data['body_chars_checked'] > 0
          assert len(data['libraries']) == 8
          print('humanizer_russian input contract: OK')
          PY
