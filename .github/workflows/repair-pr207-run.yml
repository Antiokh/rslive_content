name: Run PR 207 repair

on:
  push:
    branches:
      - agent/turkey-transit-housing-checklist

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger PR 207 repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and rebuild branch
        run: bash scripts/repair-pr207.sh
