name: rslive.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-rslive-ru
  cancel-in-progress: false

jobs:
  publish:
    name: Синхронизация
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip content-sync]')
    runs-on: ubuntu-latest

    steps:
      - name: Получение rslive_content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Подготовка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Установка парсера индекса
        run: npm install --prefix tools/content-quality --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Построение индекса для публикуемого SHA
        run: node tools/content-quality/generate-content-index.mjs

      - name: Проверка картографических данных
        run: node scripts/check-map-data.mjs

      - name: Получение движка rslive.ru
        uses: actions/checkout@v4
        with:
          repository: Antiokh/rslive.ru
          ref: main
          token: ${{ secrets.RSLIVE_CONTENT_SYNC_TOKEN }}
          path: rslive-engine
          fetch-depth: 0

      - name: Копирование контента, стикеров и карт
        run: |
          set -euo pipefail
          test -d src/content/docs
          test -d src/content/docs/about/stickers/assets/svg
          test -d map-data/core
          test -d map-data/basemaps
          test -d map-data/packs/cities
          test -d map-data/packs/poi
          test -d map-data/snapshots
          test -d rslive-engine/astro/src/content/docs

          rsync -a --delete \
            --exclude='.git/' \
            src/content/docs/ rslive-engine/astro/src/content/docs/

          mkdir -p rslive-engine/astro/src/assets/stickers
          rsync -a \
            src/content/docs/about/stickers/assets/svg/ rslive-engine/astro/src/assets/stickers/

          # Runtime map payloads use an explicit allowlist. Gzip is deliberately manual: when a
          # validated sibling .geojson.gz exists it is mirrored, otherwise runtime uses raw GeoJSON.
          # This workflow never acquires upstream map data and never compresses map resources.
          mkdir -p \
            rslive-engine/astro/public/maps/core \
            rslive-engine/astro/public/maps/basemaps \
            rslive-engine/astro/public/maps/packs/cities \
            rslive-engine/astro/public/maps/packs/poi \
            rslive-engine/astro/public/maps/snapshots \
            rslive-engine/astro/data/map-boundaries

          rsync -a --delete --delete-excluded \
            --include='serbia-overview.geojson' \
            --include='serbia-overview.geojson.gz' \
            --exclude='*' \
            map-data/core/ rslive-engine/astro/public/maps/core/

          # Build-only administrative geometry for deterministic country filtering of external
          # thematic sources. It is not a selectable runtime map layer.
          rsync -a --delete --delete-excluded \
            --include='serbia-regions.geojson' \
            --exclude='*' \
            map-data/core/ rslive-engine/astro/data/map-boundaries/

          rsync -a --delete map-data/basemaps/ rslive-engine/astro/public/maps/basemaps/

          rsync -a --delete --delete-excluded \
            --include='belgrade.geojson' \
            --include='belgrade.geojson.gz' \
            --include='belgrade-ext.geojson' \
            --include='belgrade-ext.geojson.gz' \
            --include='novi-sad.geojson' \
            --include='novi-sad.geojson.gz' \
            --include='nis.geojson' \
            --include='nis.geojson.gz' \
            --include='subotica.geojson' \
            --include='subotica.geojson.gz' \
            --exclude='*' \
            map-data/packs/cities/ rslive-engine/astro/public/maps/packs/cities/

          rsync -a --delete map-data/packs/poi/ rslive-engine/astro/public/maps/packs/poi/
          rsync -a --delete map-data/snapshots/ rslive-engine/astro/public/maps/snapshots/

      - name: Синхронизация и регистрация обновлений
        id: sync_commit
        working-directory: rslive-engine
        env:
          CONTENT_SHA: ${{ github.sha }}
          CONTENT_REPO: ${{ github.repository }}
          CONTENT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail

          CONTENT_MESSAGE="$(git -C "$GITHUB_WORKSPACE" show -s --format=%B "$CONTENT_SHA")"
          CONTENT_AUTHOR="$(git -C "$GITHUB_WORKSPACE" show -s --format=%an "$CONTENT_SHA")"
          CONTENT_AUTHOR_EMAIL="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ae "$CONTENT_SHA")"

          git config user.name "rslive_content"
          git config user.email "actions@github.com"

          if [ -z "$(git status --porcelain astro/src/content/docs astro/src/assets/stickers astro/public/maps/core astro/public/maps/basemaps astro/public/maps/packs astro/public/maps/snapshots astro/data/map-boundaries)" ]; then
            echo "Изменений контента, стикеров или карт для синхронизации нет."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "content_sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_index_paths="$(git status --porcelain -- astro/src/content/docs | awk '{print $NF}' | grep '/index\.mdx$' || true)"
          changed_index_paths="$(printf '%s\n' "$changed_index_paths" | while IFS= read -r path; do
            if [ -n "$path" ] && [ -f "$path" ]; then
              printf '%s\n' "$path"
            fi
          done)"
          changed_page_count="$(printf '%s\n' "$changed_index_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          preview_url=""
          preview_route=""
          if [ "$changed_page_count" -gt 0 ]; then
            first_index_path="$(printf '%s\n' "$changed_index_paths" | sed -n '1p')"
            route="${first_index_path#astro/src/content/docs/}"
            route="${route%index.mdx}"
            preview_route="/${route}"
            preview_url="https://rslive.ru/${route}"
          fi

          git add \
            astro/src/content/docs \
            astro/src/assets/stickers \
            astro/public/maps/core \
            astro/public/maps/basemaps \
            astro/public/maps/packs \
            astro/public/maps/snapshots \
            astro/data/map-boundaries

          subject="$(printf '%s\n' "$CONTENT_MESSAGE" | sed -n '1p')"
          if [ -z "$subject" ]; then
            subject="Sync docs from rslive_content"
          fi

          sync_subject="⇄ rslive_content: \"$subject\""
          pr_number="$(printf '%s\n' "$subject" | sed -nE 's/^Merge pull request #([0-9]+) from .*/\1/p')"
          if [ -n "$pr_number" ]; then
            pr_title="$(printf '%s\n' "$CONTENT_MESSAGE" | sed -n '1d; /^[[:space:]]*$/d; p; q')"
            if [ -n "$pr_title" ]; then
              sync_subject="⇄ rslive_content: Merge PR #${pr_number} \"${pr_title}\""
            else
              sync_subject="⇄ rslive_content: Merge PR #${pr_number}"
            fi
          fi

          {
            printf '%s\n\n' "$sync_subject"
            printf '[skip content-sync]\n\n'
            printf 'Original content commit message:\n\n'
            printf '%s\n\n' "$CONTENT_MESSAGE"
            printf 'Sync metadata:\n\n'
            printf '%s\n' "- Source repository: $CONTENT_REPO"
            printf '%s\n' "- Source commit: $CONTENT_SHA"
            printf '%s\n' "- Source URL: $CONTENT_URL"
            if [ -n "$CONTENT_AUTHOR" ]; then
              printf '%s' "- Source author: $CONTENT_AUTHOR"
              if [ -n "$CONTENT_AUTHOR_EMAIL" ]; then
                printf ' <%s>' "$CONTENT_AUTHOR_EMAIL"
              fi
              printf '\n'
            fi
            printf '%s\n' "- Sync workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/content-sync-commit-message.txt

          git commit -F /tmp/content-sync-commit-message.txt

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" = "3" ]; then
              exit 1
            fi

            git pull --rebase origin main
            sleep 5
          done

          private_sha="$(git rev-parse HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "content_sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"
          echo "private_sha=$private_sha" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "preview_route=$preview_route" >> "$GITHUB_OUTPUT"
          echo "changed_page_count=$changed_page_count" >> "$GITHUB_OUTPUT"

      - name: Публикация не требуется
        if: steps.sync_commit.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.RSLIVE_CONTENT_SYNC_TOKEN }}
          CONTENT_SHA: ${{ steps.sync_commit.outputs.content_sha }}
        run: |
          set -euo pipefail
          gh api --method POST repos/Antiokh/rslive_content/statuses/"$CONTENT_SHA" \
            -f state="success" \
            -f context="rslive.ru / Публикация" \
            -f description="Публикация не требуется: изменений для сайта нет" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Ожидание статуса сборки и выгрузки на Cloudflare
        if: steps.sync_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RSLIVE_CONTENT_SYNC_TOKEN }}
          PRIVATE_SHA: ${{ steps.sync_commit.outputs.private_sha }}
          CONTENT_SHA: ${{ steps.sync_commit.outputs.content_sha }}
          PREVIEW_URL: ${{ steps.sync_commit.outputs.preview_url }}
          PREVIEW_ROUTE: ${{ steps.sync_commit.outputs.preview_route }}
          CHANGED_PAGE_COUNT: ${{ steps.sync_commit.outputs.changed_page_count }}
        run: |
          set -euo pipefail

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST repos/Antiokh/rslive_content/statuses/"$CONTENT_SHA" \
            -f state="pending" \
            -f context="rslive.ru / Публикация" \
            -f description="Ожидание публикации сайта" \
            -f target_url="$run_url"

          cloudflare_json=""
          for attempt in $(seq 1 60); do
            cloudflare_json="$(gh api "repos/Antiokh/rslive.ru/commits/$PRIVATE_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages")] | sort_by(.started_at) | last | if . == null then empty else {status, conclusion, details_url, html_url} end' || true)"

            if [ -n "$cloudflare_json" ]; then
              status="$(printf '%s' "$cloudflare_json" | jq -r '.status')"
              if [ "$status" = "completed" ]; then
                break
              fi
            fi

            echo "Ожидание Cloudflare Pages для $PRIVATE_SHA ($attempt/60)..."
            sleep 15
          done

          if [ -z "$cloudflare_json" ]; then
            state="error"
            description="Статус публикации Cloudflare Pages не найден"
            target_url="$run_url"
          else
            conclusion="$(printf '%s' "$cloudflare_json" | jq -r '.conclusion // ""')"
            target_url="$(printf '%s' "$cloudflare_json" | jq -r '.details_url // .html_url // ""')"
            case "$conclusion" in
              success)
                state="success"
                description="Сайт опубликован"
                if [ -n "$PREVIEW_URL" ]; then
                  target_url="$PREVIEW_URL"
                  if [ "${CHANGED_PAGE_COUNT:-0}" = "1" ]; then
                    description="Опубликована страница: $PREVIEW_ROUTE"
                  else
                    description="Опубликовано страниц: ${CHANGED_PAGE_COUNT:-несколько}"
                  fi
                fi
                ;;
              failure|timed_out|cancelled|action_required)
                state="failure"
                description="Публикация сайта завершилась ошибкой"
                ;;
              *)
                state="error"
                description="Публикация сайта завершена со статусом: ${conclusion:-неизвестно}"
                ;;
            esac
          fi

          args=(
            repos/Antiokh/rslive_content/statuses/"$CONTENT_SHA"
            -f state="$state"
            -f context="rslive.ru / Публикация"
            -f description="$description"
          )
          if [ -n "${target_url:-}" ]; then
            args+=(-f target_url="$target_url")
          fi
          gh api --method POST "${args[@]}"

          if [ "$state" != "success" ]; then
            exit 1
          fi
