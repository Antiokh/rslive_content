name: Sync Spy audit with main

on:
  push:
    branches: [agent/spy-audit-2026-08-15]
    paths:
      - '.github/workflows/sync-spy-audit-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve housing intentionally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "src/content/docs/move/housing/index.mdx" ]; then
              echo "Unexpected conflicts:" >&2
              echo "$conflicts" >&2
              exit 1
            fi
            git checkout --theirs -- src/content/docs/move/housing/index.mdx
          fi
      - name: Reapply audited housing additions on current main
        shell: python
        run: |
          import pathlib

          path = pathlib.Path('src/content/docs/move/housing/index.mdx')
          text = path.read_text()
          assert '### Как передавать показания электричества' not in text
          if 'sourceCheckedAt:' not in text.split('---', 2)[1]:
              live = 'live: "https://rslive.ru/move/housing/"\n'
              assert live in text
              text = text.replace(live, live + 'sourceCheckedAt: 2026-08-15\n', 1)

          anchor = 'После переезда зарегистрируйтесь по новому адресу.'
          assert anchor in text
          utility = '''## Коммунальные отключения и показания счётчика\n\n### Где проверять плановые отключения\n\nВ Сербии предупреждения об отключениях обычно публикует сам оператор сети или городское коммунальное предприятие. Для электричества `Elektrodistribucija Srbije` публикует плановые отключения по распределительным областям Белград, Нови-Сад, Кралево, Крагуевац и Ниш — с датой, временем, муниципалитетом и улицами.[^4]\n\nДля воды используйте сайт местного водоканала:\n\n- **Белград** — `Beogradski vodovod i kanalizacija`, раздел `Planirani radovi`; там же публикуются аварии.[^5]\n- **Нови-Сад** — `Vodovod i kanalizacija Novi Sad`, раздел `Najava radova / Servisne informacije`.[^6]\n- **Ниш** — `JKP Naissus`, раздел `Servisne informacije`.[^7]\n\n<Aside type="tip" title="Если отключение уже произошло">\n  Сначала проверьте плановые работы и аварии у оператора. Если вашего адреса в списках нет, тогда звоните в аварийную/контактную службу: это быстрее, чем искать объяснение в районных чатах.\n</Aside>\n\n### Как передавать показания электричества\n\n`Elektrodistribucija Srbije` принимает самостоятельные показания счётчика **с 1-го по 6-е число каждого месяца**. Передать их можно через приложение **ED Srbija**, официальный сайт EDS, электронную почту, стойку обслуживания или бесплатный контакт-центр **0800 360 300**.[^8]\n\nДля домохозяйств на гарантированном снабжении EPS действует скидка **6%** за самостоятельную передачу показаний в установленный срок при оплате счёта до 20-го числа месяца. EPS подтверждала применение этой скидки и в 2026 году.[^9]\n\n<Aside type="caution" title="Не ориентируйтесь на старое правило «раз в три месяца»">\n  В публикациях 2025 года встречалось утверждение, что оператор будет физически снимать показания только раз в три месяца. EDS позднее официально сообщила, что применение части закона, связанной с увеличенным периодом считывания, временно отложено. Самостоятельная передача показаний с 1-го по 6-е число работает, но фактическую периодичность контрольного считывания проверяйте по текущим сообщениям EDS.[^8]\n</Aside>\n\n'''
          text = text.replace(anchor, utility + anchor, 1)

          old_parking = '''  * **Zona** - платная зона для парковки. В Белграде поделен на 4 зоны для парковки, которые ограничены по времени. Для жителей некоторых районов есть возможность покупки ежемесячного абонемента на парковочные места. Общую информацию о городском перемещении смотрите в разделе [транспорта](/arrival/prevoz/).\n\n**Зоны:**\n  * **Зона А (фиолетовая)** — разрешенное время парковки 30 мин (100 дин.).\n  * **Зона 1 (красная)** — разрешенное время парковки 1 час (56 дин.).\n  * **Зона 2 (желтая)** — разрешенное время парковки 120 мин (48 дин.).\n  * **Зона 3 (зеленая)** — разрешенное время парковки 180 мин (41 дин.).'''
          new_parking = '''  * **Zona** - платная городская зона. Цвета, тарифы и максимальное время меняются и отличаются по городам. Для постоянных жителей зонированных улиц могут действовать льготные месячные карты. Актуальные правила Белграда и Нови-Сада см. в отдельной инструкции [по парковке](/drive/parking/).'''
          assert old_parking in text
          text = text.replace(old_parking, new_parking, 1)

          assert '[^4]:' not in text
          text = text.rstrip() + '''\n[^4]: Elektrodistribucija Srbije: [плановые отключения](https://www.elektrodistribucija.rs/) по распределительным областям.\n[^5]: JKP Beogradski vodovod i kanalizacija: [плановые работы](https://www.bvk.rs/planirani-radovi/).\n[^6]: JKP Vodovod i kanalizacija Novi Sad: [анонсы работ и сервисная информация](https://www.vikns.rs/najava-radova/).\n[^7]: JKP Naissus Niš: [сервисная информация](https://jkpnaissus.co.rs/servisne-informacije/).\n[^8]: Elektrodistribucija Srbije: [официальные сообщения и способы передачи показаний](https://www.elektrodistribucija.rs/informacije/saopstenja). EDS принимает самостоятельные показания с 1-го по 6-е число и сообщала о временном отложении применения нормы о более длинном периоде считывания.\n[^9]: Elektroprivreda Srbije: [скидки за январский счёт 2026 года](https://www.eps.rs/cir/vesti/Pages/eps-racun-januar-popust.aspx) — для домохозяйств, самостоятельно передающих показания, сохранялась скидка 6%; базовое правило предусматривает оплату до 20-го числа.\n'''
          path.write_text(text)
      - name: Commit merge
        run: |
          git add -A
          git commit -m 'Merge current main into Spy audit branch'
          git push
