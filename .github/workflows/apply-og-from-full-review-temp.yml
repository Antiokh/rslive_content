name: Temporary apply OG from full review

on:
  push:
    branches:
      - agent/apply-og-stickers-full-inventory

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-og-stickers-full-inventory
          fetch-depth: 1

      - name: Fetch full review inventory
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Antiokh/rslive_content/agent/og-sticker-review/docs/OG_STICKER_REVIEW.md \
            --output /tmp/OG_STICKER_REVIEW.md

      - name: Apply every inventory decision
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('src/content/docs')
          report = Path('/tmp/OG_STICKER_REVIEW.md').read_text(encoding='utf-8')
          if '## Полный инвентарь' not in report or '## Как комментировать' not in report:
              raise SystemExit('review inventory section not found')
          inventory = report.split('## Полный инвентарь', 1)[1].split('## Как комментировать', 1)[0]

          targets = {}
          for line in inventory.splitlines():
              if not line.startswith('| ') or line.startswith('| Текущий стикер') or line.startswith('|---'):
                  continue
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3:
                  raise SystemExit(f'cannot parse inventory row: {line[:180]}')
              _, middle, proposed = parts
              mr = re.match(r'`([^`]+)`<br><br>', middle)
              if not mr:
                  raise SystemExit(f'cannot parse route: {middle[:180]}')
              route = mr.group(1)
              mc = re.search(r'<code>([^<]+)</code>', proposed)
              target = mc.group(1).strip() if mc else None
              if route in targets:
                  raise SystemExit(f'duplicate inventory route: {route}')
              targets[route] = target

          if len(targets) < 290:
              raise SystemExit(f'expected full inventory, got only {len(targets)} routes')

          # Latest explicit editorial decision: moustached Heisenberg, not crystals.
          targets['/integration/social/'] = 'heisenberg'

          route_to_file = {}
          for path in list(root.rglob('*.mdx')) + list(root.rglob('*.md')):
              rel = path.relative_to(root)
              if rel.name in {'index.mdx', 'index.md'}:
                  parts = rel.parts[:-1]
              else:
                  parts = rel.with_suffix('').parts
              route = '/' + '/'.join(parts) + '/' if parts else '/'
              if route in route_to_file:
                  raise SystemExit(f'duplicate content route {route}: {route_to_file[route]} and {path}')
              route_to_file[route] = path

          def desired_explicit(label):
              if label is None or label == '—':
                  return 'SKIP'
              if label.startswith('fallback → '):
                  if label != 'fallback → giant-book':
                      raise SystemExit(f'unknown fallback label: {label}')
                  return None
              if not re.fullmatch(r'[a-z0-9][a-z0-9_-]*', label):
                  raise SystemExit(f'invalid sticker slug in review: {label}')
              return label

          # Validate sticker assets before touching content.
          slugs = {desired_explicit(v) for v in targets.values()}
          slugs.discard(None)
          slugs.discard('SKIP')
          for slug in sorted(slugs):
              webp = root / f'about/stickers/assets/webp/{slug}.webp'
              svg = root / f'about/stickers/assets/svg/{slug}.svg'
              if not webp.is_file():
                  raise SystemExit(f'missing WebP sticker: {webp}')
              if slug != 'pig-in-bushes' and not svg.is_file():
                  raise SystemExit(f'missing SVG sticker: {svg}')

          changed = []
          skipped_engine = []
          missing = []

          for route, label in targets.items():
              desired = desired_explicit(label)
              if desired == 'SKIP':
                  if route not in route_to_file:
                      skipped_engine.append(route)
                  continue

              path = route_to_file.get(route)
              if path is None:
                  missing.append(route)
                  continue

              text = path.read_text(encoding='utf-8')
              fm = re.match(r'\A---\r?\n(.*?)\r?\n---(?=\r?\n|\Z)', text, flags=re.S)
              if not fm:
                  raise SystemExit(f'frontmatter not found: {path}')
              front = fm.group(1)
              lines = front.splitlines()
              og_indexes = [i for i, line in enumerate(lines) if re.match(r'^ogSticker\s*:', line)]
              if len(og_indexes) > 1:
                  raise SystemExit(f'duplicate ogSticker: {path}')

              old = None
              if og_indexes:
                  old = lines[og_indexes[0]].split(':', 1)[1].strip().strip('"\'')

              if desired is None:
                  if og_indexes:
                      del lines[og_indexes[0]]
                  else:
                      continue
              else:
                  new_line = f'ogSticker: {desired}'
                  if og_indexes:
                      if old == desired and lines[og_indexes[0]] == new_line:
                          continue
                      lines[og_indexes[0]] = new_line
                  else:
                      insert_at = None
                      for key in ('keywords:', 'sourceCheckedAt:', 'live:', 'linking:', 'sidebar:'):
                          for i, line in enumerate(lines):
                              if line.startswith(key):
                                  insert_at = i
                                  break
                          if insert_at is not None:
                              break
                      if insert_at is None:
                          insert_at = len(lines)
                      lines.insert(insert_at, new_line)

              new_front = '\n'.join(lines)
              new_text = text[:fm.start(1)] + new_front + text[fm.end(1):]
              path.write_text(new_text, encoding='utf-8')
              changed.append((route, path.as_posix(), old, desired))

          if missing:
              raise SystemExit('review routes with sticker targets but no MD/MDX file: ' + ', '.join(sorted(missing)))

          # Exact post-application validation against every content-backed inventory row.
          mismatches = []
          for route, label in targets.items():
              desired = desired_explicit(label)
              if desired == 'SKIP':
                  continue
              path = route_to_file.get(route)
              if path is None:
                  continue
              text = path.read_text(encoding='utf-8')
              fm = re.match(r'\A---\r?\n(.*?)\r?\n---(?=\r?\n|\Z)', text, flags=re.S)
              lines = fm.group(1).splitlines()
              vals = [line.split(':', 1)[1].strip().strip('"\'') for line in lines if re.match(r'^ogSticker\s*:', line)]
              actual = vals[0] if vals else None
              if actual != desired:
                  mismatches.append(f'{route}: expected {desired!r}, got {actual!r}')
          if mismatches:
              raise SystemExit('post-apply mismatches:\n' + '\n'.join(mismatches))

          print(f'Full inventory routes: {len(targets)}')
          print(f'Content-backed decisions changed in this pass: {len(changed)}')
          print(f'Engine-owned/skip routes: {len(skipped_engine)}')
          for route, path, old, new in changed:
              print(f'{route}\t{old!r} -> {new!r}\t{path}')

      - name: Sanity-check diff
        run: |
          git diff --check
          if git diff --name-only | grep -v '^src/content/docs/.*\.mdx\?$' | grep -q .; then
            echo 'Unexpected changed file outside content MD/MDX' >&2
            git diff --name-only >&2
            exit 1
          fi

      - name: Commit full-inventory OG changes
        run: |
          if git diff --quiet -- src/content/docs; then
            echo 'No content changes required.'
            exit 0
          fi
          git config user.name "Anton Nazarov"
          git config user.email "antiokh@yandex.ru"
          git add src/content/docs
          git commit -m "content: apply reviewed OG stickers from full inventory"
          git push origin HEAD:agent/apply-og-stickers-full-inventory
